"}}};\nglobalThis.CG_CHILD = {\"week\":1,\"lessonId\":\"Y7-168\",\"mode\":\"class\",\"eyebrow\":\"Week 1\"};\n\u003c/script>\n\u003cscript>\n/* Put it on the line: four game adapters, one frame. Printed TA games are separate.\n   Every round comes from explore_games.py's recomputed, assessment-screened pools. */\n(function (root) {\n  'use strict';\n  var doc = root.document, active = null;\n  var SPEEDS=[['Steady',5],['Quicker',8],['Fast',12]], KNOCK_BACK=30, WRONG_JUMP=15, FREEZE_MS=5000, FREEZE_EVERY=5, MAX_PUSH=2.5;\n  var COLOURS = ['#4a6fa5', '#c36129', '#8057a2', '#27805a'];\n  var reduced = root.matchMedia('(prefers-reduced-motion: reduce)').matches;\n  function el(tag, cls, text) { var e = doc.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }\n  function btn(text, cls, fn) { var e = el('button', 'eg-button ' + (cls || ''), text); e.type = 'button'; e.onclick = fn; return e; }\n  function fmt(n) { return String(n).replace('-', '\\u2212'); }\n  function cp(a) { return JSON.parse(JSON.stringify(a)); }\n  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }\n  function games() { return (root.EXPLORE_GAMES || {}).games || {}; }\n  function enabled(code) { var id = 'Y7-' + String(code).replace(/^SB-/, ''); return games()[id] && games()[id].enabled ? id : null; }\n  function load(key) { try { var n = Number(root.localStorage.getItem(key)); return Number.isFinite(n) && n >= 0 ? n : 0; } catch (_) { return 0; } }\n  function save(key, value) { try { root.localStorage.setItem(key, String(value)); } catch (_) {} }\n\n  // Scene choices and final-round rules live here; the mathematical pools are unchanged.\n  var JOURNEYS = {\n    'Y7-168': {kind:'ice', title:'Across the ice shelf', goal:'Research station reached.', moved:'Marked.', held:'Ice creaks. Hold position.', sky:['#243752','#a9c3cf'], recoil:[-.6,0], rise:.9, home:10, final:{rounds:5,hearts:3}},\n    'Y7-423': {kind:'sea', title:'Sea platform lift', goal:'Surface reached.', moved:'Landed.', held:'Hold this floor.', hint:'Rise: go up. Fall: go down. Crossing zero, stop at zero first, then go on.', sky:['#2a3d5c','#94b6c2'], sea:['#3f8399','#16324c'], recoil:[0,1.2], rise:2.1, home:0, final:{rounds:5,hearts:3}},\n    'Y7-169': {kind:'city', title:'Across the rooftops', goal:'Last roof cleared.', moved:'Landed.', held:'Back to this roof.', sky:['#273754','#c39c92'], recoil:[-.8,1], rise:1.6, home:10, final:{rounds:5,hearts:3}},\n    'Y7-424': {kind:'orbit', title:'Orbital stations', goal:'Probe docked.', moved:'Docked.', held:'Drift corrected.', sky:['#1f2a47','#3c4668'], recoil:[1,1], home:0, final:{rounds:5,hearts:3}}\n  };\n  var starMemory = {};\n  function starsFor(lid) { return Math.min(3,Math.floor(Math.max(starMemory[lid]||0,load('mathslab-game-'+lid+'-stars')))); }\n  function starRow(count) {\n    var row=el('span','eg-stars');row.setAttribute('role','img');row.setAttribute('aria-label',count+' of 3 stars');\n    for(var i=0;i\u003c3;i++){var icon=doc.createElementNS('http://www.w3.org/2000/svg','svg');icon.setAttribute('viewBox','0 0 24 24');icon.setAttribute('aria-hidden','true');icon.classList.add(i\u003ccount?'earned':'empty');icon.innerHTML='\u003cpath d=\"m12 2 3 6.4 7 .9-5.1 4.9 1.3 7-6.2-3.4-6.2 3.4 1.3-7L2 9.3l7-.9Z\"/>';row.appendChild(icon);}\n    return row;\n  }\n  // The picture is the game board. Everything sits at a percentage of it, so the numbers keep their size at any width.\n  var GROUND=74, ROOFS=[65,61,68,63,70,62,67,60,66,69,63,68,61,66,70,63,67,60,69,64,62];\n  function lineAt(v){return 3+(v+10)/20*94;}\n  function spot(kind,v){\n    if(kind==='sea')return {x:0,y:100-lineAt(v)};\n    if(kind==='city')return {x:lineAt(v),y:ROOFS[v+10]};\n    if(kind==='orbit'){var a=-Math.PI/2+v*2*Math.PI/7;return {x:50+44*Math.cos(a),y:50+38*Math.sin(a)};}\n    return {x:lineAt(v),y:GROUND};\n  }\n  function makeScene(host, config, state) {\n    var ns='http://www.w3.org/2000/svg', kind=config.kind, animations=[], current=spot(kind,0), shelf=null;\n    function node(tag,attrs,parent){var n=doc.createElementNS(ns,tag);Object.keys(attrs||{}).forEach(function(k){n.setAttribute(k,attrs[k]);});(parent||svg).appendChild(n);return n;}\n    function storey(v){return 4.6*(100-lineAt(v));}\n    var svg=doc.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 1160 460');svg.setAttribute('preserveAspectRatio','none');svg.setAttribute('role','img');svg.setAttribute('aria-label',config.title);host.appendChild(svg);\n    var defs=node('defs');\n    function gradient(id,attrs,stops){var g=node('linearGradient',Object.assign({id:id},attrs),defs);stops.forEach(function(c,i){node('stop',{offset:i/(stops.length-1),'stop-color':c},g);});return 'url(#'+id+')';}\n    var world=node('g');\n    function shape(tag,attrs){return node(tag,attrs,world);}\n    var skyFill=gradient('eg-sky-'+kind,{x2:0,y2:1},config.sky);\n    if(kind==='sea'){\n      // Sky, far rig, water and seabed. The water's surface is exactly the board's half way, where 0 is.\n      shape('rect',{width:1160,height:230,fill:skyFill});\n      shape('path',{d:'M1010 230v-34h6v34zM1088 230v-34h6v34zM996 196h112v-7H996zM1040 189l10-48 10 48z',fill:'#54708a',opacity:.8});\n      shape('rect',{y:230,width:1160,height:230,fill:gradient('eg-deep-sea',{x2:0,y2:1},config.sea)});\n      [254,280].forEach(function(y,i){shape('path',{d:'M0 '+y+'H1160',stroke:'#a9d6dd','stroke-width':1,opacity:.22-i*.08});});\n      shape('path',{d:'M0 230H1160',stroke:'#d7ecef','stroke-width':2});\n      shape('path',{d:'M0 460V418L130 404 270 428 430 412 540 442 800 442 920 416 1040 432 1160 406V460Z',fill:'#132b42'});\n      // The platform: legs from the seabed, decks on whole numbers, rooms above and below the water.\n      [538,738].forEach(function(x){shape('rect',{x:x,width:14,height:230,fill:'#75899c'});shape('rect',{x:x,y:230,width:14,height:216,fill:'#2f5a74'});});\n      [10,6,2].forEach(function(v){shape('rect',{x:508,y:storey(v)-3,width:292,height:6,fill:'#8a9dae'});});\n      [-3,-7].forEach(function(v){shape('rect',{x:508,y:storey(v)-3,width:292,height:6,fill:'#3b6a84'});});\n      shape('rect',{x:510,y:storey(6)+3,width:74,height:storey(2)-storey(6)-6,fill:'#5f7488'});\n      shape('rect',{x:726,y:storey(10)+3,width:70,height:storey(6)-storey(10)-6,fill:'#5f7488'});\n      [524,546,568].forEach(function(x){shape('rect',{x:x-3,y:storey(4)-4,width:7,height:9,fill:'#e0c98f',opacity:.75});});\n      [742,764,786].forEach(function(x){shape('rect',{x:x-5,y:storey(8)-4,width:7,height:9,fill:'#e0c98f',opacity:.75});});\n      shape('rect',{x:510,y:storey(-3)+3,width:74,height:storey(-7)-storey(-3)-6,fill:'#25506a'});\n      shape('rect',{x:726,y:storey(-3)+3,width:70,height:storey(-7)-storey(-3)-6,fill:'#25506a'});\n      [526,547,568,742,762,782].forEach(function(x){shape('circle',{cx:x,cy:storey(-5),r:5,fill:'#9fd0da',opacity:.7});});\n      shape('path',{d:'M782 92L970 30M782 92V36L970 30M970 30v84',fill:'none',stroke:'#5f7488','stroke-width':4});\n      shape('rect',{x:958,y:114,width:24,height:15,fill:'#5f7488'});\n    }else if(kind==='ice'){\n      // The ground is the temperature line: ice on the left, warmer land on the right.\n      shape('rect',{width:1160,height:460,fill:skyFill});\n      shape('path',{d:'M0 310 110 196 190 266 290 164 410 284 500 236 640 340H0Z',fill:'#c5d8df',opacity:.8});\n      shape('path',{d:'M560 340 680 276 780 312 900 254 1030 304 1160 266V340Z',fill:'#8b9b90',opacity:.65});\n      var ground=gradient('eg-ground',{gradientUnits:'userSpaceOnUse',x1:0,x2:1160,y1:0,y2:0},['#eaf3f6','#dbe7ea','#d2d3b2','#bdb488']);\n      shape('rect',{y:340,width:1160,height:120,fill:'#37637b'});\n      shelf=shape('g',{'class':'eg-ice-shelf'});\n      for(var slab=0;slab\u003c6;slab++)node('rect',{x:slab*100,y:340,width:slab===5?120:100,height:120,fill:ground,stroke:'#c3d4da','stroke-width':1},shelf);\n      shape('rect',{x:600,y:340,width:560,height:120,fill:ground});\n      [[770,34],[812,46],[886,38],[944,50],[1000,36]].forEach(function(t){shape('path',{d:'M'+t[0]+' 340l'+(t[1]*.36)+'-'+t[1]+' '+(t[1]*.36)+' '+t[1]+'z',fill:'#5f7d6c'});});\n      shape('path',{d:'M1048 340v-48h76v48zM1038 292l48-28 48 28z',fill:'#dce5e9',stroke:'#b4c4cd','stroke-width':1});\n      shape('rect',{x:1078,y:310,width:15,height:30,fill:'#54718a'});\n    }else if(kind==='city'){\n      // Each rooftop is a number; zero is the marked roof.\n      shape('rect',{width:1160,height:460,fill:skyFill});\n      shape('circle',{cx:960,cy:70,r:34,fill:'#e0c5b2',opacity:.6});\n      for(var far=0;far\u003c16;far++)shape('rect',{x:far*80-10,y:196+(far*37%5)*16,width:72,height:280,fill:far%2?'#3c4c67':'#465571',opacity:.8});\n      ROOFS.forEach(function(top,i){\n        var v=i-10,x=11.6*lineAt(v)-25,y=4.6*top,zero=v===0;\n        shape('rect',{x:x,y:y,width:50,height:460-y,fill:zero?'#c9cfd8':i%2?'#2f3f59':'#374863','data-roof':v});\n        shape('rect',{x:x-2,y:y-3,width:54,height:5,fill:zero?'#e7c98f':'#6f7f98'});\n        for(var w=0;w\u003c6;w++)shape('rect',{x:x+9+(w%2)*22,y:y+58+Math.floor(w/2)*24,width:10,height:12,fill:zero?'#8e9ab0':'#e0c98f',opacity:zero?.5:(i*3+w*5)%7===0?.65:.13});\n      });\n      var mast=4.6*ROOFS[10]-3;shape('path',{d:'M580 '+mast+'v-34',stroke:'#e7c98f','stroke-width':2});shape('path',{d:'M580 '+(mast-34)+'l18 7-18 7z',fill:'#e7c98f'});\n    }else{\n      // One orbit: the stations on it are the numbers.\n      shape('rect',{width:1160,height:460,fill:skyFill});\n      [[46,40],[150,402],[300,30],[420,420],[760,28],[905,415],[1030,48],[1120,380],[90,240],[1100,212]].forEach(function(p){shape('circle',{cx:p[0],cy:p[1],r:1.3,fill:'#c3cede'});});\n      host.appendChild(el('div','eg-planet'));\n      shape('ellipse',{cx:580,cy:230,rx:510.4,ry:174.8,fill:'none',stroke:'#c3cbdd','stroke-width':1.5});\n    }\n    var danger=node('g',{'class':'eg-scene-danger'}),light=node('circle',{cx:580,cy:230,r:120,fill:'#edf6df',opacity:0,'class':'eg-payoff-light'});\n    if(kind==='sea'){node('rect',{y:230,width:1160,height:460,fill:'#9fd3dc',opacity:.35},danger);node('path',{d:'M0 230H1160',stroke:'#e2f3f5','stroke-width':2},danger);}\n    else if(kind==='ice')node('rect',{y:460,width:1160,height:460,fill:'#5f9db0',opacity:.6},danger);\n    else if(kind==='city')node('rect',{y:460,width:1160,height:460,fill:'#84bdc8',opacity:.45},danger);\n    else{node('ellipse',{cx:580,cy:230,rx:510.4,ry:174.8,fill:'none',stroke:'#d0a08b','stroke-width':2,opacity:.7},danger);danger.style.transformOrigin='580px 230px';}\n    var caption=el('p','eg-scene-caption',config.title),body=el('div','eg-scene-actor'),car=null;\n    if(kind==='sea'){host.appendChild(el('div','eg-column'));car=el('div','eg-car');body.appendChild(car);}\n    else{\n      var fig=doc.createElementNS(ns,'svg');fig.setAttribute('class','eg-fig eg-fig-'+kind);fig.setAttribute('aria-hidden','true');body.appendChild(fig);\n      if(kind==='ice'){fig.setAttribute('viewBox','-34 -24 44 32');for(var j=0;j\u003c3;j++){var figure=node('g',{transform:'translate('+(-j*11)+','+(j%2*3-3)+')'},fig);node('path',{d:'M-3-17h6l2 10-4 5 3 8h-3l-4-8-3 8h-3l4-12Z',fill:'#354860'},figure);node('path',{d:'M-3-17v-5h6v5',fill:'#354860'},figure);}}\n      else if(kind==='city'){fig.setAttribute('viewBox','-16 -29 38 30');node('path',{d:'M-2-28h7v6h-7ZM0-21l9 6 9-4 2 3-12 6-6-3-4 12-10 6-2-3 8-7 3-13-11 3-1-3Z',fill:'#f0e6da'},fig);}\n      else{fig.setAttribute('viewBox','-20 -8 40 16');node('path',{d:'m0-7 9 7-9 7-9-7Z',fill:'#e3ceb1'},fig);node('path',{d:'M-19-5h10v10h-10Zm28 0h10v10H9Z',fill:'#7cabc1'},fig);}\n    }\n    host.appendChild(caption);host.appendChild(body);\n    // At rest the probe sits just inside its station, so it never covers the number.\n    function rest(v){var p=spot(kind,v);if(kind==='orbit'){var a=-Math.PI/2+v*2*Math.PI/7;p.ox=-46*Math.cos(a);p.oy=-46*Math.sin(a);}return p;}\n    function at(p){return 'translate(calc('+p.x+'% + '+(p.ox||0)+'px),calc('+p.y+'% + '+(p.oy||0)+'px))';}\n    function seen(){if(!animations.length)return current;var m=new root.DOMMatrixReadOnly(root.getComputedStyle(body).transform);return {x:m.m41/body.offsetWidth*100,y:m.m42/body.offsetHeight*100};}\n    function route(from,to,start){\n      var points=[start],n=Math.abs(to-from),step=to>from?1:-1,i;\n      if(kind==='city')for(i=1;i\u003c=n;i++){var a=spot(kind,from+step*(i-1)),b=spot(kind,from+step*i);points.push({x:(a.x+b.x)/2,y:Math.min(a.y,b.y)-7});points.push(b);}\n      if(kind==='orbit')for(i=1;i\u003c8;i++)points.push(spot(kind,from+(to-from)*i/8));\n      points.push(rest(to));return points.map(function(p){return {transform:at(p)};});\n    }\n    function stop(){animations.forEach(function(a){a.cancel();});animations=[];}\n    function position(v){current=rest(v);body.style.transform=at(current);if(car)car.textContent=fmt(v);state.position=v;caption.textContent=config.title;svg.setAttribute('aria-label',config.title);light.setAttribute('opacity','0');}\n    function move(v, actor){var start=seen();stop();var frames=route(state.position,v,start),n=Math.abs(v-state.position);current=rest(v);body.style.transform=at(current);body.dataset.actor=actor;if(car)car.textContent=fmt(v);state.position=v;state.actor=actor;state.moves++;state.last='right';host.dataset.last='right';\n      if(!reduced)animations.push(body.animate(frames,{duration:kind==='city'?Math.min(1500,Math.max(1,n)*170):kind==='ice'?Math.min(1000,260+n*55):560,easing:kind==='sea'?'cubic-bezier(.25,.65,.3,1)':kind==='ice'?'ease-in-out':'linear'}));\n      caption.textContent=config.moved;\n    }\n    function wrong(actor){var moving=animations.some(function(a){return a.playState==='running';});if(!moving)stop();state.actor=actor;state.wrongs++;state.last='wrong';host.dataset.last='wrong';body.dataset.actor=actor;caption.textContent=config.held;\n      if(!reduced&&!moving)animations.push(body.animate([{transform:at(current)},{transform:at({x:current.x+config.recoil[0],y:current.y+config.recoil[1],ox:current.ox,oy:current.oy})},{transform:at(current)}],{duration:400}));\n    }\n    function pressure(heat,part){host.dataset.heat=String(Math.round(heat));danger.style.opacity=part===2?String(.15+heat/120):'0';if(shelf)[].forEach.call(shelf.children,function(piece,i){piece.setAttribute('transform','translate('+(part===2?(i-2.5)*heat*.18:0)+',0)');});danger.style.transform=kind==='orbit'?'scale('+(1-heat*.005)+')':'translateY('+(-heat*config.rise)+'px)';}\n    function payoff(actor){stop();var from=current,target=rest(config.home);current=target;body.style.transform=at(target);if(car)car.textContent=fmt(config.home);state.payoff=true;state.actor=actor;state.last='payoff';host.dataset.last='payoff';caption.textContent=config.goal;svg.setAttribute('aria-label',config.title+' — '+config.goal);light.setAttribute('cx',kind==='sea'?673:11.6*target.x);light.setAttribute('cy',4.6*target.y);light.setAttribute('opacity',reduced?'.15':'0');\n      if(!reduced){animations.push(body.animate([{transform:at(from)},{transform:at(target)}],{duration:650,easing:'ease-out'}));animations.push(light.animate([{opacity:0},{opacity:.45,offset:.35},{opacity:0}],{duration:850}));}\n    }\n    return {position:position,move:move,wrong:wrong,pressure:pressure,payoff:payoff,stop:stop};\n  }\n\n  function mount(parent, lid, navigate) {\n    var data = games()[lid]; if (!data || !data.enabled || !data.levels) throw new Error('This game is not enabled or its pools are stale');\n    if (active) active.destroy();\n    parent.textContent = ''; parent.className = 'eg';\n    var destroyed = false, timers = [], frame = null, lastT=0, nextBeep=0, ac=null, epoch = 0, r = null, last = '', key = 'mathslab-game-' + lid + '-';\n    var s = { lessonId: lid, mode: 'solo', level: 0, levels: [0,0], classLevel: 0, nTeams: 2, names: ['Team 1','Team 2','Team 3','Team 4'], scores: [0,0, nglobalThis.CG_CHILD = {\"week\":2,\"lessonId\":\"Y7-038\",\"mode\":\"class\",\"eyebrow\":\"Week 2\"};\n\u003c/script>\n\u003cscript>\n/* Race to zero (Y7-038, week 2 of the Unit 3 readiness pack): the lesson's printed race game as a class game, in the\n   Explore game frame's look (explore-games.css: .eg header, mode buttons, team points, feedback line).\n\n   One turn: roll two dice (the total is shown, \"4 + 5 = 9\"), take that many away. The ONE calculation is the new total,\n   typed on the keypad by the team or by the adult for the group. When the ones are not enough, the board shows the\n   exchange first, as the lesson does: a ten rod breaks into ten ones (\"Not enough ones? Exchange 1 ten for 10 ones\n   first.\"). Right: the blocks are taken away and the team's marker moves towards 0. Wrong: one hint in the lesson's\n   words, then the answer; the only cost is the lost move. A roll bigger than what is left takes it all: the team\n   reaches 0. The first to reach 0 wins.\n\n   Data: root.EXPLORE_GAMES.games[lid], the shape explore_games.py writes, with `race` added by the class-games generator\n   (the start, the dice to avoid because their calculation repeats an assessment, and the lesson's words).\n   RaceGame.mount(parent, lid, navigate, opts) mirrors ExploreGames.mount. RaceGame.logic is pure, for the tests. */\n(function (root) {\n  'use strict';\n  var doc = root.document, active = null;\n  var COLOURS = ['#4a6fa5', '#c36129', '#8057a2', '#27805a'];          // the frame's team colours\n  var reduced = !!(root.matchMedia && root.matchMedia('(prefers-reduced-motion: reduce)').matches);\n  var U = 20, GAP = 8, OGAP = 7, PAD = 14, HEAD = 40, TENS_W = 300, ONES_W = 170;   // the blocks mat, in px\n  var MINUS = '−';\n\n  // ------------------------------------------------------------------ the arithmetic (pure)\n  function step(total, roll) {\n    var take = Math.min(roll, total), t = Math.floor(total / 10), o = total % 10;\n    var takeT = Math.floor(take / 10), takeO = take % 10, exchange = o \u003c takeO;\n    var T = exchange ? t - 1 : t, O = exchange ? o + 10 : o;\n    return { total: total, roll: roll, take: take, finish: roll >= total, over: roll > total, answer: total - take,\n      tens: t, ones: o, takeTens: takeT, takeOnes: takeO, exchange: exchange, tensAfter: T, onesAfter: O,\n      leftTens: T - takeT, leftOnes: O - takeO };\n  }\n  function count(n, one, many) { return n + ' ' + (n === 1 ? one : many); }\n  function tens(n) { return count(n, 'ten', 'tens'); }\n  function ones(n) { return count(n, 'one', 'ones'); }\n  function parts(n) { return tens(Math.floor(n / 10)) + ' and ' + ones(n % 10); }\n  function stay(text, n) { return text + (n === 1 ? ' stays' : ' stay'); }\n  function fill(template, map) { return String(template).replace(/\\{(\\w+)\\}/g, function (_, k) { return map[k] != null ? map[k] : ''; }); }\n  // words: the lesson's own sentences as templates, from the generator (the lesson's language[0]); the default is the same.\n  function sentences(c, words) {\n    var out = {};\n    words = words || {};\n    out.calc = c.total + ' ' + MINUS + ' ' + c.take;\n    out.full = out.calc + ' = ' + c.answer;\n    out.parts = c.total + ' = ' + parts(c.total);\n    out.cant = fill(words.cant || 'I can\\'t take {take} from {have}, so I exchange 1 ten for 10 ones.', { take: c.takeOnes, have: c.ones });\n    out.still = c.total + ' = ' + tens(c.tensAfter) + ' and ' + ones(c.onesAfter) + '. It is still ' + c.total + '.';\n    if (c.over) out.over = 'You rolled ' + c.roll + '. Only ' + c.total + ' is left, so take it all away.';\n    if (c.take === c.total) out.hint = 'Take away everything that is left. What is left after that?';\n    else {\n      out.hint = c.takeOnes ? 'Start with the ones: ' + ones(c.onesAfter) + ' take away ' + ones(c.takeOnes) + '.'\n        : 'Start with the ones: there are no ones to take away.';\n      out.hint += c.takeTens ? ' Then the tens: ' + tens(c.tensAfter) + ' take away 1 ten.' : ' Then the tens: ' + stay('the ' + tens(c.tensAfter), c.tensAfter) + '.';\n    }\n    if (c.take === c.total) out.reveal = c.total + ' take away ' + c.take + ' is 0.';\n    else {\n      out.reveal = (c.takeOnes ? ones(c.onesAfter) + ' take away ' + ones(c.takeOnes) + ' is ' + ones(c.leftOnes) + '. '\n        : 'No ones to take away: ' + stay('the ' + ones(c.leftOnes), c.leftOnes) + '. ')\n        + (c.takeTens ? tens(c.tensAfter) + ' take away 1 ten is ' + tens(c.leftTens) + '. ' : stay('The ' + tens(c.tensAfter), c.tensAfter) + '. ')\n        + c.total + ' take away ' + c.take + ' is ' + c.answer + '.';\n    }\n    return out;\n  }\n  // The dice: two random faces; a roll whose calculation repeats an assessment (race.avoid) is rolled again.\n  function rollDice(total, avoid, rand) {\n    rand = rand || Math.random;\n    var d = [1, 1];\n    for (var tries = 0; tries \u003c 40; tries++) {\n      d = [1 + Math.floor(rand() * 6), 1 + Math.floor(rand() * 6)];\n      if (!avoid || !avoid[total + '-' + (d[0] + d[1])]) break;\n    }\n    return d;\n  }\n\n  // ------------------------------------------------------------------ small helpers\n  function el(tag, cls, text) { var e = doc.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }\n  function btn(text, cls, fn) { var e = el('button', 'eg-button ' + (cls || ''), text); e.type = 'button'; e.onclick = fn; return e; }\n  function load(key) { try { var n = Number(root.localStorage.getItem(key)); return Number.isFinite(n) && n >= 0 ? n : 0; } catch (_) { return 0; } }\n  function save(key, value) { try { root.localStorage.setItem(key, String(value)); } catch (_) {} }\n  function loadSound() { try { return root.localStorage.getItem('mathslab-classgames-sound') !== 'off'; } catch (_) { return true; } }\n  function saveSound(on) { try { root.localStorage.setItem('mathslab-classgames-sound', on ? 'on' : 'off'); } catch (_) {} }\n  function pipSvg(n) {\n    var spots = { 1: [[50, 50]], 2: [[28, 28], [72, 72]], 3: [[26, 26], [50, 50], [74, 74]], 4: [[28, 28], [72, 28], [28, 72], [72, 72]],\n      5: [[26, 26], [74, 26], [50, 50], [26, 74], [74, 74]], 6: [[28, 24], [72, 24], [28, 50], [72, 50], [28, 76], [72, 76]] }[n] || [];\n    return '\u003csvg viewBox=\"0 0 100 100\" aria-hidden=\"true\">' + spots.map(function (p) { return '\u003ccircle cx=\"' + p[0] + '\" cy=\"' + p[1] + '\" r=\"9.5\"/>'; }).join('') + '\u003c/svg>';\n  }\n\n  // ------------------------------------------------------------------ the game\n  function mount(parent, lid, navigate, opts) {\n    var data = ((root.EXPLORE_GAMES || {}).games || {})[lid];\n    if (!data || !data.enabled || !data.race) throw new Error('Race to zero is not enabled or has no race data');\n    opts = opts || {};\n    if (active) active.destroy();\n    parent.textContent = ''; parent.className = 'eg rz';\n    var race = data.race, words = race.words || {}, avoid = {};\n    (race.avoid || []).forEach(function (k) { avoid[k] = true; });\n    var destroyed = false, timers = [], epoch = 0, ac = null, noiseBuf = null, queue = [], key = 'mathslab-game-' + lid + '-';\n    var s = { lessonId: lid, mode: 'solo', nTeams: 2, names: ['Team 1', 'Team 2', 'Team 3', 'Team 4'], totals: [], points: [0, 0, 0, 0],\n      turns: [0, 0, 0, 0], streak: 0, best: load(key + 'best'), turn: 0, phase: 'roll', over: false, winner: null, sound: loadSound(),\n      entry: '', tries: 0, dice: null, cur: null, exchanges: 0, hints: 0, reveals: 0, rights: 0, history: [] };\n\n    // header, bar, body: the frame's chrome\n    var header = el('header', 'eg-header'), heading = el('div');\n    heading.appendChild(el('p', 'eg-eyebrow', (opts.eyebrow ? opts.eyebrow + ' · ' : '') + data.code + ' · ' + data.title));\n    var title = el('h1', '', data.game.name); title.tabIndex = -1; heading.appendChild(title);\n    header.appendChild(btn(opts.backLabel || 'Games', 'eg-back', function () { navigate('#games'); }));\n    header.appendChild(heading);\n    header.appendChild(btn('How to play', 'rz-howbtn', function () { showHow(true); }));\n    if (opts.onFullscreen) header.appendChild(btn('Full screen', 'rz-fs', opts.onFullscreen));\n    header.appendChild(btn('Play again', 'eg-restart', function () { restart(false); }));\n    parent.appendChild(header);\n    var bar = el('div', 'eg-bar rz-bar'); parent.appendChild(bar);\n    var modes = el('div', 'eg-modes'); modes.setAttribute('role', 'group'); modes.setAttribute('aria-label', 'Who is playing'); bar.appendChild(modes);\n    ['solo', 'two', 'class'].forEach(function (m, i) { var b = btn(['1 player', '2 players', 'Class'][i], '', function () { s.mode = m; restart(false); }); b.dataset.mode = m; modes.appendChild(b); });\n    var hud = el('div', 'eg-hud rz-hud'); bar.appendChild(hud);\n    var sound = btn('Sound on', 'eg-sound rz-sound', function () { s.sound = !s.sound; saveSound(s.sound); drawBar(); if (s.sound) sfx('tick'); }); bar.appendChild(sound);\n\n    var body = el('div', 'eg-body rz-body'), play = el('section', 'eg-play rz-play'), teams = el('aside', 'eg-teams rz-teams');\n    teams.setAttribute('aria-label', 'Team points'); body.appendChild(play); body.appendChild(teams); parent.appendChild(body);\n    var boardBox = el('div', 'rz-board'); play.appendChild(boardBox);\n    var track = el('div', 'rz-track'); track.setAttribute('role', 'img'); boardBox.appendChild(track);\n    var lower = el('div', 'rz-lower'); boardBox.appendChild(lower);\n    var ask = el('div', 'rz-ask'); lower.appendChild(ask);\n    var who = el('p', 'eg-who rz-who'), diceRow = el('div', 'rz-dicerow'), diceBox = el('div', 'rz-dice'), sum = el('p', 'rz-sum');\n    var dieA = el('div', 'rz-die'), dieB = el('div', 'rz-die'); diceBox.appendChild(dieA); diceBox.appendChild(dieB);\n    diceRow.appendChild(diceBox); diceRow.appendChild(sum);\n    var prompt = el('h2', 'eg-prompt rz-question'), notes = el('div', 'rz-notes'), controls = el('div', 'rz-controls');\n    var askHead = el('div', 'rz-askhead'); askHead.appendChild(who); askHead.appendChild(diceRow);   // one row once the question shows\n    [askHead, prompt, notes, controls].forEach(function (e) { ask.appendChild(e); });\n    var matWrap = el('div', 'rz-matwrap'), mat = el('div', 'rz-mat'), matCap = el('p', 'rz-matcap');\n    mat.setAttribute('role', 'img'); matWrap.appendChild(mat); matWrap.appendChild(matCap); lower.appendChild(matWrap);\n    var cover = el('div', 'rz-cover'); cover.hidden = true; boardBox.appendChild(cover);\n    var feedback = el('p', 'eg-feedback'); feedback.setAttribute('role', 'status'); feedback.setAttribute('aria-live', 'polite'); parent.appendChild(feedback);\n    parent.appendChild(el('p', 'eg-keyhelp', 'Press Roll, or the space bar. Type the new total on the keypad or with the number keys, then Check or Enter.'));\n\n    // the mat's fixed parts: headings, the column line and the exchange arrow\n    var matHead = el('div', 'rz-mathead');\n    matHead.appendChild(el('span', 'rz-col-t', 'Tens')); matHead.appendChild(el('span', 'rz-col-o', 'Ones')); mat.appendChild(matHead);\n    mat.appendChild(el('i', 'rz-divider'));\n    var arrow = doc.createElementNS('http://www.w3.org/2000/svg', 'svg'); arrow.setAttribute('class', 'rz-arrow'); arrow.setAttribute('aria-hidden', 'true');\n    mat.appendChild(arrow);\n    var pieces = el('div', 'rz-pieces'); mat.appendChild(pieces);\n\n    function later(fn, ms) { var token = epoch; timers.push(root.setTimeout(function () { if (!destroyed && token === epoch) fn(); }, reduced ? Math.min(ms, 60) : ms)); }\n    function cancel() { epoch++; timers.forEach(root.clearTimeout); timers = []; }\n    var fxTimers = [];\n    function fx(fn, ms) { fxTimers.push(root.setTimeout(function () { if (!destroyed) fn(); }, reduced ? 0 : ms)); }\n    function stopFx() { fxTimers.forEach(root.clearTimeout); fxTimers = []; }\n    function sides() { return s.mode === 'solo' ? 1 : s.mode === 'two' ? 2 : s.nTeams; }\n    function sideName(i) { return s.mode === 'solo' ? 'You' : s.mode === 'two' ? 'Player ' + (i + 1) : s.names[i]; }\n    function goName(i) { return s.mode === 'solo' ? 'Your go' : sideName(i) + '’s go'; }\n    function tell(text, tone) { feedback.textContent = text; feedback.className = 'eg-feedback' + (tone ? ' ' + tone : ''); }\n\n    // ---------------------------------------------------------------- sound: short tones made in the browser, no files\n    function audio() {\n      if (!s.sound || destroyed) return null;\n      try { ac = ac || new (root.AudioContext || root.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume().catch(function () {}); return ac; } catch (_) { return null; }\n    }\n    function tone(f, ms, type, vol, slideTo, delay) {\n      var a = audio(); if (!a) return;\n      try {\n        var o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (delay || 0) / 1000, end = t + ms / 1000;\n        o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, end);\n        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.06, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, end);\n        o.connect(g); g.connect(a.destination); o.start(t); o.stop(end + 0.02);\n      } catch (_) {}\n    }\n    function rattle(ms, vol, delay, freq) {\n      var a = audio(); if (!a) return;\n      try {\n        if (!noiseBuf) { noiseBuf = a.createBuffer(1, Math.floor(a.sampleRate * 0.08), a.sampleRate); var ch = noiseBuf.getChannelData(0); for (var i = 0; i \u003c ch.length; i++) ch[i] = Math.random() * 2 - 1; }\n        var src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + (delay || 0) / 1000;\n        src.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq || 2400; f.Q.value = 1.4;\n        g.gain.setValueAtTime(vol || 0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);\n        src.connect       'A roll bigger than what is left takes it all. The first to reach 0 wins.'].forEach(function (t) { ol.appendChild(el('li', '', t)); });\n      panel.appendChild(ol);\n      panel.appendChild(el('h3', '', 'The game in the lesson'));\n      var ul = el('ul'); (data.game.how || []).forEach(function (t) { ul.appendChild(el('li', '', t)); }); panel.appendChild(ul);\n      panel.appendChild(btn('Close', 'rz-close', function () { showHow(false); }));\n      cover.appendChild(panel); cover.hidden = false; panel.querySelector('.rz-close').focus({ preventScroll: true });\n    }\n    function keydown(e) {\n      if (destroyed || e.ctrlKey || e.altKey || e.metaKey || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;\n      if (!cover.hidden && cover.classList.contains('rz-how')) { if (e.key === 'Escape') showHow(false); return; }\n      var onButton = e.target.tagName === 'BUTTON';\n      if (s.phase === 'roll' && (e.key === ' ' || e.key === 'Enter') && !onButton) { e.preventDefault(); doRoll(); return; }\n      if (s.phase !== 'answer') return;\n      if (/^[0-9]$/.test(e.key)) { e.preventDefault(); press(e.key); }\n      else if (e.key === 'Backspace') { e.preventDefault(); press('del'); }\n      else if (e.key === 'Enter' && (!onButton || e.target.classList.contains('rz-key'))) { e.preventDefault(); check(); }\n    }\n    root.addEventListener('keydown', keydown);\n    var api = {\n      state: function () { return JSON.parse(JSON.stringify(Object.assign({}, s, { avoidCount: Object.keys(avoid).length }))); },\n      queueDice: function (pairs) { queue = queue.concat(pairs || []); return queue.length; },\n      setMode: function (m, n) { s.mode = m; if (n) s.nTeams = n; restart(false); },\n      destroy: function () { destroyed = true; cancel(); stopFx(); root.removeEventListener('keydown', keydown); if (ac) { ac.close().catch(function () {}); ac = null; } parent.textContent = ''; if (active === api) active = null; }\n    };\n    active = api;\n    s.mode = ['solo <script>
/* Unit 3 class games: the start screen, the #week1 to #week6 links and the scaling. Each game is its own page in an

   1280 x 720 and 1920 x 1080. Offline: no network, no libraries. */
(function (root) {
  'use strict';
  var doc = root.document, CG = root.CG, DOCS = root.CG_DOCS || {};
  var home = doc.getElementById('cg-home'), soon = doc.getElementById('cg-soon'), play = doc.getElementById('cg-play');
  var tiles = doc.getElementById('cg-tiles'), frame = null, lastWeek = null;
  doc.getElementById('cg-pack').textContent = CG.pack + ' · Class games';

  function el(tag, cls, text) { var e = doc.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  // small pictures for the tiles: geometric, quiet, no faces
  var PICS = {
    ice: '<svg viewBox="0 0 340 90" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="cgi" x2="0" y2="1"><stop offset="0" stop-color="#243752"/><stop offset="1" stop-color="#a9c3cf"/></linearGradient><linearGradient id="cgg" x2="1"><stop offset="0" stop-color="#eaf3f6"/><stop offset=".55" stop-color="#dbe7ea"/><stop offset=".8" stop-color="#d2d3b2"/><stop offset="1" stop-color="#bdb488"/></linearGradient></defs><rect width="340" height="90" fill="url(#cgi)"/><path d="M0 64 34 36 58 52 88 30 122 56 150 46 190 66H0Z" fill="#c5d8df" opacity=".8"/><path d="M170 66 206 52 236 60 270 48 306 58 340 50V66Z" fill="#8b9b90" opacity=".65"/><rect y="66" width="340" height="24" fill="url(#cgg)"/><path d="M306 66v-12h22v12zM303 54l14-8 14 8z" fill="#dce5e9"/><g fill="#354860"><path d="M96 66l3-11h4l2 6-3 5z"/><path d="M84 66l3-11h4l2 6-3 5z"/><path d="M72 66l3-11h4l2 6-3 5z"/></g></svg>',
    race: '<svg viewBox="0 0 340 90" preserveAspectRatio="xMidYMid slice"><rect width="340" height="90" fill="#e8efed"/><rect y="20" width="340" height="30" fill="#efe6d4"/><rect y="50" width="340" height="30" fill="#ebe0cb"/><path d="M0 20H340M0 50H340M0 80H340" stroke="#fffaf0"/><path d="M30 20V80" stroke="#176f70" stroke-width="3"/><g stroke="#fffaf0"><path d="M90 20V80M150 20V80M210 20V80M270 20V80"/></g><g><rect x="310" y="20" width="12" height="60" fill="#fff" stroke="#4a5163"/><path d="M310 26h6v6h-6zM316 32h6v6h-6zM310 38h6v6h-6zM316 44h6v6h-6zM310 50h6v6h-6zM316 56h6v6h-6zM310 62h6v6h-6zM316 68h6v6h-6zM310 74h6v6h-6z" fill="#4a5163"/></g><text x="30" y="14" font-size="11" font-weight="700" fill="#3a4254" text-anchor="middle" font-family="Arial">99</text><text x="316" y="14" font-size="11" font-weight="700" fill="#176f70" text-anchor="middle" font-family="Arial">0</text><g font-family="Arial" font-size="13" font-weight="700" fill="#fff" text-anchor="middle"><rect x="176" y="25" width="40" height="20" rx="10" fill="#4a6fa5" stroke="#fff" stroke-width="1.5"/><text x="196" y="40">62</text><rect x="116" y="55" width="40" height="20" rx="10" fill="#c36129" stroke="#fff" stroke-width="1.5"/><text x="136" y="70">78</text></g></svg>',
    bingo: '<svg viewBox="0 0 340 90" preserveAspectRatio="xMidYMid meet"><rect width="340" height="90" fill="#f4f8f8"/><g font-family="Arial" font-size="11" font-weight="700" fill="#3a4254" text-anchor="middle">' + [0, 1, 2].map(function (r) { return [0, 1, 2].map(function (c) { var x = 112 + c * 40, y = 8 + r * 25, on = (r + c) % 3 === 0; return '<rect x="' + x + '" y="' + y + '" width="36" height="21" rx="3" fill="' + (on ? '#ffe29a' : '#fff') + '" stroke="#a9b8c3"/><text x="' + (x + 18) + '" y="' + (y + 15) + '">£' + [2.17, 1.33, 5.55, 1.66, 1.48, 2.84, 2.12, 1.93, 1.75][r * 3 + c].toFixed(2) + '</text>'; }).join(''); }).join('') + '</g></svg>',
    noughts: '<svg viewBox="0 0 340 90" preserveAspectRatio="xMidYMid meet"><rect width="340" height="90" fill="#f4f8f8"/><path d="M152 8V82M188 8V82M122 32H218M122 58H218" stroke="#a9b8c3" stroke-width="2"/><path d="M128 12l18 16M146 12l-18 16M194 64l18 14M212 64l-18 14" stroke="#4a6fa5" stroke-width="3" stroke-linecap="round"/><circle cx="170" cy="45" r="9" fill="none" stroke="#c36129" stroke-width="3"/><circle cx="204" cy="20" r="9" fill="none" stroke="#c36129" stroke-width="3"/></svg>',
    truefalse: '<svg viewBox="0 0 340 90" preserveAspectRatio="xMidYMid meet"><rect width="340" height="90" fill="#f4f8f8"/><g font-family="Arial" font-weight="700" text-anchor="middle"><rect x="96" y="14" width="64" height="62" rx="8" fill="#e2f3e8" stroke="#278f50"/><text x="128" y="56" font-size="32" fill="#146c3c">T</text><rect x="180" y="14" width="64" height="62" rx="8" fill="#fcf0d2" stroke="#e3a21a"/><text x="212" y="56" font-size="32" fill="#8a5a10">F</text></g></svg>',
    splat: '<svg viewBox="0 0 340 90" preserveAspectRatio="xMidYMid meet"><rect width="340" height="90" fill="#f4f8f8"/><g font-family="Arial" font-size="15" font-weight="700" fill="#3a4254" text-anchor="middle">' + [[60, 24, '252'], [130, 60, '108'], [200, 22, '18'], [262, 58, '230'], [96, 66, '103'], [170, 40, '318'], [292, 26, '23']].map(function (p) { return '<rect x="' + (p[0] - 24) + '" y="' + (p[1] - 15) + '" width="48" height="26" rx="6" fill="' + (p[2] === '108' ? '#ffe29a' : '#fff') + '" stroke="#a9b8c3"/><text x="' + p[0] + '" y="' + (p[1] + 4) + '">' + p[2] + '</text>'; }).join('') + '</g></svg>'
  };
  function pic(name) { var d = el('div', 'cg-pic'); d.innerHTML = PICS[name] || ''; d.setAttribute('aria-hidden', 'true'); return d; }

  CG.weeks.forEach(function (w) {
    var li = el('li'), b = el('button', 'cg-tile' + (w.ready ? '' : ' soon')); b.type = 'button'; b.dataset.week = w.n;
    var top = el('div', 'cg-top'); top.appendChild(el('span', 'cg-week', 'Week ' + w.n)); top.appendChild(el('span', 'cg-topic', w.topic)); b.appendChild(top);
    b.appendChild(el('span', 'cg-name', w.game)); b.appendChild(el('span', 'cg-gsub', w.sub)); b.appendChild(pic(w.pic));
    var foot = el('div', 'cg-foot'); foot.appendChild(el('span', '', w.lesson + ' · ' + w.lessonTitle));
    foot.appendChild(w.ready ? el('span', 'cg-play', 'Play →') : el('span', 'cg-soonchip', 'Coming soon')); b.appendChild(foot);
    b.setAttribute('aria-label', 'Week ' + w.n + ', ' + w.topic + ': ' + w.game + (w.ready ? '' : ', coming soon'));
    b.addEventListener('click', function () { go('#week' + w.n); });
    li.appendChild(b); tiles.appendChild(li);
  });

  function fit() {
    var W = root.innerWidth, H = root.innerHeight, k = Math.min(W / 1280, H / 720), x = (W - 1280 * k) / 2, y = (H - 720 * k) / 2;
    [home, soon, frame].forEach(function (e) { if (e) e.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + k + ')'; });
    doc.documentElement.dataset.scale = k.toFixed(3);
  }
  function go(hash) { if (root.location.hash === hash) route(); else root.location.hash = hash; }
  function closeGame() { if (frame) { frame.remove(); frame = null; } play.hidden = true; }
  function showHome() {
    closeGame(); soon.hidden = true; home.hidden = false; doc.title = 'Unit 3 class games'; fit();
    var t = lastWeek && tiles.querySelector('[data-week="' + lastWeek + '"]'); if (t) t.focus({ preventScroll: true });
  }
  function showSoon(w) {
    closeGame(); home.hidden = true; soon.hidden = false; soon.textContent = '';
    soon.appendChild(el('p', 'cg-eyebrow', 'Week ' + w.n + ' · ' + w.topic));
    var h = el('h1', '', w.game); h.tabIndex = -1; soon.appendChild(h);
    soon.appendChild(el('p', 'cg-big', w.sub));
    soon.appendChild(pic(w.pic));
    soon.appendChild(el('p', 'cg-big', 'Coming soon. This game will be built the same way as Race to zero once week 2 has been tried.'));
    soon.appendChild(el('p', 'cg-sub', 'Lesson ' + w.lesson + ' · ' + w.lessonTitle + '. Until then, play it from the lesson’s slides.'));
    var back = el('button', 'cg-btn', 'All weeks'); back.type = 'button'; back.style.marginTop = '14px'; back.addEventListener('click', function () { go(''); }); soon.appendChild(back);
    doc.title = 'Week ' + w.n + ' · ' + w.game + ' · coming soon'; fit(); h.focus({ preventScroll: true });
  }
  function openGame(w) {
    closeGame(); home.hidden = true; soon.hidden = true; play.hidden = false;
    frame = doc.createElement('iframe'); frame.id = 'cg-frame'; frame.title = 'Week ' + w.n + ': ' + w.game;
    frame.setAttribute('allow', 'autoplay; fullscreen');
    frame.srcdoc = DOCS[w.doc]; play.appendChild(frame); fit();
    frame.addEventListener('load', function () { try { frame.contentWindow.focus(); } catch (_) {} });
    doc.title = 'Week ' + w.n + ' · ' + w.game + ' · Unit 3 class games';
  }
  function route() {
    var m = /^#week([1-6])$/i.exec(root.location.hash || '');
    if (!m) { showHome(); return; }
    var w = CG.weeks[Number(m[1]) - 1]; lastWeek = w.n;
    if (w.ready && DOCS[w.doc]) openGame(w); else showSoon(w);
  }
  function toggleFull() {
    try {
      if (doc.fullscreenElement) { var p = doc.exitFullscreen(); if (p && p.catch) p.catch(function () {}); }
      else if (doc.documentElement.requestFullscreen) { var q = doc.documentElement.requestFullscreen(); if (q && q.catch) q.catch(function () {}); }
    } catch (_) {}
  }
  doc.querySelectorAll('.cg-fullbtn').forEach(function (b) { b.addEventListener('click', toggleFull); });
  doc.addEventListener('fullscreenchange', function () { doc.querySelectorAll('.cg-fullbtn').forEach(function (b) { b.textContent = doc.fullscreenElement ? 'Exit full screen' : 'Full screen'; }); fit(); });
  root.addEventListener('message', function (e) {
    if (!frame || e.source !== frame.contentWindow) return;
    var d = e.data || {};
    if (d.cg === 'home') go(''); else if (d.cg === 'fullscreen') toggleFull();
  });
  root.addEventListener('resize', fit);
  root.addEventListener('hashchange', route);
  root.CG_SHELL = { route: route, fit: fit, frame: function () { return frame; } };
  route();
})(window);

</script>
