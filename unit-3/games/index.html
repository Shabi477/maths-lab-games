------------------------------------------- the arithmetic (pure)\n  function step(total, roll) {\n    var take = Math.min(roll, total), t = Math.floor(total / 10), o = total % 10;\n    var takeT = Math.floor(take / 10), takeO = take % 10, exchange = o \u003c takeO;\n    var T = exchange ? t - 1 : t, O = exchange ? o + 10 : o;\n    return { total: total, roll: roll, take: take, finish: roll >= total, over: roll > total, answer: total - take,\n      tens: t, ones: o, takeTens: takeT, takeOnes: takeO, exchange: exchange, tensAfter: T, onesAfter: O,\n      leftTens: T - takeT, leftOnes: O - takeO };\n  }\n  function count(n, one, many) { return n + ' ' + (n === 1 ? one : many); }\n  function tens(n) { return count(n, 'ten', 'tens'); }\n  function ones(n) { return count(n, 'one', 'ones'); }\n  function parts(n) { return tens(Math.floor(n / 10)) + ' and ' + ones(n % 10); }\n  function stay(text, n) { return text + (n === 1 ? ' stays' : ' stay'); }\n  function fill(template, map) { return String(template).replace(/\\{(\\w+)\\}/g, function (_, k) { return map[k] != null ? map[k] : ''; }); }\n  // words: the lesson's own sentences as templates, from the generator (the lesson's language[0]); the default is the same.\n  function sentences(c, words) {\n    var out = {};\n    words = words || {};\n    out.calc = c.total + ' ' + MINUS + ' ' + c.take;\n    out.full = out.calc + ' = ' + c.answer;\n    out.parts = c.total + ' = ' + parts(c.total);\n    out.cant = fill(words.cant || 'I can\\'t take {take} from {have}, so I exchange 1 ten for 10 ones.', { take: c.takeOnes, have: c.ones });\n    out.still = c.total + ' = ' + tens(c.tensAfter) + ' and ' + ones(c.onesAfter) + '. It is still ' + c.total + '.';\n    if (c.over) out.over = 'You rolled ' + c.roll + '. Only ' + c.total + ' is left, so take it all away.';\n    if (c.take === c.total) out.hint = 'Take away everything that is left. What is left after that?';\n    else {\n      out.hint = c.takeOnes ? 'Start with the ones: ' + ones(c.onesAfter) + ' take away ' + ones(c.takeOnes) + '.'\n        : 'Start with the ones: there are no ones to take away.';\n      out.hint += c.takeTens ? ' Then the tens: ' + tens(c.tensAfter) + ' take away 1 ten.' : ' Then the tens: ' + stay('the ' + tens(c.tensAfter), c.tensAfter) + '.';\n    }\n    if (c.take === c.total) out.reveal = c.total + ' take away ' + c.take + ' is 0.';\n    else {\n      out.reveal = (c.takeOnes ? ones(c.onesAfter) + ' take away ' + ones(c.takeOnes) + ' is ' + ones(c.leftOnes) + '. '\n        : 'No ones to take away: ' + stay('the ' + ones(c.leftOnes), c.leftOnes) + '. ')\n        + (c.takeTens ? tens(c.tensAfter) + ' take away 1 ten is ' + tens(c.leftTens) + '. ' : stay('The ' + tens(c.tensAfter), c.tensAfter) + '. ')\n        + c.total + ' take away ' + c.take + ' is ' + c.answer + '.';\n    }\n    return out;\n  }\n  // The dice: two random faces; a roll whose calculation repeats an assessment (race.avoid) is rolled again.\n  function rollDice(total, avoid, rand) {\n    rand = rand || Math.random;\n    var d = [1, 1];\n    for (var tries = 0; tries \u003c 40; tries++) {\n      d = [1 + Math.floor(rand() * 6), 1 + Math.floor(rand() * 6)];\n      if (!avoid || !avoid[total + '-' + (d[0] + d[1])]) break;\n    }\n    return d;\n  }\n\n  // ------------------------------------------------------------------ small helpers\n  function el(tag, cls, text) { var e = doc.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }\n  function btn(text, cls, fn) { var e = el('button', 'eg-button ' + (cls || ''), text); e.type = 'button'; e.onclick = fn; return e; }\n  function load(key) { try { var n = Number(root.localStorage.getItem(key)); return Number.isFinite(n) && n >= 0 ? n : 0; } catch (_) { return 0; } }\n  function save(key, value) { try { root.localStorage.setItem(key, String(value)); } catch (_) {} }\n  function loadSound() { try { return root.localStorage.getItem('mathslab-classgames-sound') Box.appendChild(dieB);\n    diceRow.appendChild(diceBox); diceRow.appendChild(sum);\n    var prompt = el('h2', 'eg-prompt rz-question'), notes = el('div', 'rz-notes'), controls = el('div', 'rz-controls');\n    var askHead = el('div', 'rz-askhead'); askHead.appendChild(who); askHead.appendChild(diceRow);   // one row once the question shows\n    [askHead, prompt, notes, controls].forEach(function (e) { ask.appendChild(e); });\n    var matWrap = el('div', 'rz-matwrap'), mat = el('div', 'rz-mat'), matCap = el('p', 'rz-matcap');\n    mat.setAttribute('role', 'img'); matWrap.appendChild(mat); matWrap.appendChild(matCap); lower.appendChild(matWrap);\n    var cover = el('div', 'rz-cover'); cover.hidden = true; boardBox.appendChild(cover);\n    var feedback = el('p', 'eg-feedback'); feedback.setAttribute('role', 'status'); feedback.setAttribute('aria-live', 'polite'); parent.appendChild(feedback);\n    parent.appendChild(el('p', 'eg-keyhelp', 'Press Roll, or the space bar. Type the new total on the keypad or with the number keys, then Check or Enter.'));\n\n    // the mat's fixed parts: headings, the column line and the exchange arrow\n    var matHead = el('div', 'rz-mathead');\n    matHead.appendChild(el('span', 'rz-col-t', 'Tens')); matHead.appendChild(el('span', 'rz-col-o', 'Ones')); mat.appendChild(matHead);\n    mat.appendChild(el('i', 'rz-divider'));\n    var arrow = doc.createElementNS('http://www.w3.org/2000/svg', 'svg'); arrow.setAttribute('class', 'rz-arrow'); arrow.setAttribute('aria-hidden', 'true');\n    mat.appendChild(arrow);\n    var pieces = el('div', 'rz-pieces'); mat.appendChild(pieces);\n\n    function later(fn, ms) { var token = epoch; timers.push(root.setTimeout(function () { if (!destroyed && token === epoch) fn(); }, reduced ? Math.min(ms, 60) : ms)); }\n    function cancel() { epoch++; timers.forEach(root.clearTimeout); timers = []; }\n    var fxTimers = [];\n    function fx(fn, ms) { fxTimers.push(root.setTimeout(function () { if (!destroyed) fn(); c.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq || 2400; f.Q.value = 1.4;\n        g.gain.setValueAtTime(vol || 0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);\n        src.connect(f); f.connect(g); g.connect(a.destination); src.start(t); src.stop(t + ms / 1000 + 0.02);\n      } catch (_) {}\n    }\n    function sfx(name) {\n      if (!s.sound) return;\n      if (name === 'dice') [0, 80, 170, 270, 390, 530, 690].forEach(function (d, i) { rattle(55, 0.09 - i * 0.008, d, 1800 + (i % 3) * 600); });\n      else if (name === 'land') { rattle(70, 0.1, 0, 1400); tone(190, 90, 'triangle', 0.05); }\n      else if (name === 'exchange') for (var i = 0; i \u003c 10; i++) tone(820 + i * 70, 60, 'sine', 0.035, null, i * 45);\n      else if (name === 'right') { tone(523, 140, 'sine', 0.07); tone(784, 260, 'sine', 0.07, null, 120); }\n      else if (name === 'wrong') tone(233, 220, 'triangle', 0.06, 175);\n      else if (name === 'tick') tone(1100, 40, 'sine', 0.03);\n      else if (name === 'move') rattle(260, 0.03, 0, 900);\n      else if (name === 'win') [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i === 3 ? 700 : 220, 'triangle', 0.07, null, i * 130); });\n    }\n\n    // ---------------------------------------------------------------- the track: one lane a side, 99 at the start, 0 at the finish\n    var lanes = [], markers = [];\n    function xAt(v) { return 2 + (99 - v) / 99 * 94; }\n    function drawTrack() {\n      track.textContent = ''; lanes = []; markers = [];\n      var n = sides(), laneH = n >= 4 ? 32 : n === 3 ? 36 : 40;\n      track.style.setProperty('--lanes', n); track.style.setProperty('--lane-h', laneH + 'px');\n      track.dataset.lanes = n;\n      var course = el('div', 'rz-course');\n      [99, 90, 80, 70, 60, 50, 40, 30, 20, 10].forEach(function (v) {\n        var tick = el('i', 'rz-tick' + (v === 99 ? ' rz-start' : '')); tick.style.left = xAt(v) + '%'; course.appendChild(tick);\n        var lab = el('span' {from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}\n.cx-winpanel{text-align:center;max-width:820px}.cx-flag{width:96px;height:64px;margin:0 auto 10px;border:2px solid #fff;border-radius:4px;background:repeating-conic-gradient(#fff 0 25%,transparent 0 50%) 0 0/24px 24px;animation:cx-wave 1.1s ease-in-out infinite alternate}\n@keyframes cx-wave{from{transform:skewY(-3deg)}to{transform:skewY(3deg)}}\n.eg .cx-winhead{margin:0 0 6px;color:#fff;font:700 42px/1.15 Arial,sans-serif}.cx-winhead:focus{outline:none}.cx-winline{margin:4px 0 10px;font:600 22px/1.3 Arial,sans-serif}\n.cx-wintable{display:grid;gap:6px;min-width:480px;margin:10px auto 12px}.cx-winrow{display:grid;grid-template-columns:1fr auto auto;gap:22px;padding:7px 16px;background:rgba(255,255,255,.16);border-radius:8px;text-align:left;font:600 21px/1.3 Arial,sans-serif}\n.cx-winrow.first{background:#fff;color:var(--row)}\n.cx-endq{margin:6px auto 12px;padding:10px 14px;background:rgba(255,255,255,.14);border-radius:10px;font:18px/1.35 Arial,sans-serif}.cx-endq p{margin:0 0 6px}.cx-endq-a{font-weight:700}\n.eg-button.cx-endshow{background:transparent;border-color:#fff;color:#fff}\n.eg-button.cx-again{min-height:56px;padding:10px 34px;background:#fff;border-color:#fff;color:var(--team);font:700 24px/1 Arial,sans-serif}.eg-button.cx-again:hover{background:#f6f2ea}\n.cx-howpanel{max-width:800px;color:#3a4254;font:19px/1.4 Arial,sans-serif}.cx-howpanel h2{margin:0 0 6px;font-size:28px}.cx-howpanel h3{margin:14px 0 4px;color:#5a6172;font-size:18px}.cx-howpanel ol,.cx-howpanel ul{margin:0;padding-left:26px}.cx-howpanel li{margin:3px 0}.cx-howpanel .cx-close{margin-top:16px}\n\n\u003c/style>\n\u003cstyle>\n/* Class games file: the game is one 1280 x 720 slide, scaled by the page around it. */\nhtml,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#fffaf0}\nbody.cg-child #cg-game.eg{margin:0 auto}\n\n\u003c/style>\n\u003c/head>\n\u003cbody class=\"cg-child\">\n\u003cmain id=\"cg-game\">\u003c/main>\n\u003cscript>\nglobalThis.EXPLORE_GAMES = {\"schema\":2,\"games\":{\"Y7-109\":{\"lessonId\":\"Y7-109\",\"code\":\"SB-109\",\"unit\":3,\"block\":\"b\",\"title\":\"Add decimals in columns\",\"enabled\":true,\"game\":{\"name\":\"Shopping bingo\",\"players\":\"The group, in 2 teams\",\"time\":\"5 to 8 minutes\",\"how\":[\"Print a bingo card for each pupil with the Print bingo cards button, or draw a 3 by 3 grid. Choose nine of the sixteen totals on the screen and write one in each square.\",\"Press Next call: two things from the school shop come up with their prices, such as pencil £0.48 + ruler £0.85.\",\"Everyone adds them in columns on a whiteboard, points in a line. Cross the total out if it is on your card.\",\"A full line: say \\\"Bingo!\\\" and read back your totals. Check shows every call so far.\"],\"board\":{\"kind\":\"bingo\",\"unit\":\"\",\"calls\":[{\"say\":\"Rubber £0.63 + glue stick £1.54\",\"answer\":\"£2.17\"},{\"say\":\"Pencil £0.48 + ruler £0.85\",\"answer\":\"£1.33\"},{\"say\":\"Notebook £2.36 + pencil case £3.19\",\"answer\":\"£5.55\"},{\"say\":\"Pen £1.27 + sharpener £0.39\",\"answer\":\"£1.66\"},{\"say\":\"Rubber £0.63 + ruler £0.85\",\"answer\":\"£1.48\"},{\"say\":\"Pencil £0.48 + notebook £2.36\",\"answer\":\"£2.84\"},{\"say\":\"Ruler £0.85 + pen £1.27\",\"answer\":\"£2.12\"},{\"say\":\"Glue stick £1.54 + sharpener £0.39\",\"answer\":\"£1.93\"},{\"say\":\"Pencil £0.48 + pen £1.27\",\"answer\":\"£1.75\"},{\"say\":\"Rubber £0.63 + pencil case £3.19\",\"answer\":\"£3.82\"},{\"say\":\"Pen £1.27 + glue stick £1.54\",\"answer\":\"£2.81\"},{\"say\":\"Pencil £0.48 + sharpener £0.39\",\"answer\":\"£0.87\"},{\"say\":\"Ruler £0.85 + notebook £2.36\",\"answer\":\"£3.21\"},{\"say\":\"Pencil £0.48 + rubber £0.63\",\"answer\":\"£1.11\"},{\"say\":\"Glue stick £1.54 + notebook £2.36\",\"answer\":\"£3.90\"},{\"say\":\"Pencil £0.48 + pencil case £3.19\",\"answer\":\"£3.67\"}],\"title\":\"Shopping bingo\"},\"answers\":[\"Rubber £0.63 + glue stick £1.54 = £2.17\",\"Pencil £0.48 + ruler £0.85 = £1.33\",\"Notebook £2.36 + pencil case £3.19 = £5.55\",\"Pen £1.27 + sharpener £0.39 = £1.66\",\"Rubber £0.63 + ruler £0.85 = £1.48\",\"Pencil £0.48 + notebook £2.36 = £2.84\",\"Ruler £0.85 + pen £1.27 = £2.12\",\"Glue stick £1.54 + sharpener £0.39 = £1.93\",\"Pencil £0.48 + pen £1.27 = £1.75\",\"Rubber £0.63 + pencil case £3.19 = £3.82\",\"Pen £1.27 + glue stick £1.54 = £2.81\",\"Pencil £0.48 + sharpener £0.39 = £0.87\",\"Ruler £0.85 + notebook £2.36 = £3.21\",\"Pencil £0.48 + rubber £0.63 = £1.11\",\"Glue stick £1.54 + notebook £2.36 = £3.90\",\"Pencil £0.48 + pencil case £3.19 = £3.67\"],\"print\":\"Bingo cards: one A4 page of six empty 3 by 3 grids, with the sixteen totals.\"},\"cg\":{\"kind\":\"bingo\",\"items\":[{\"say\":\"Rubber £0.63 + glue stick £1.54\",\"answer\":\"£2.17\",\"cents\":217,\"things\":[{\"name\":\"Rubber\",\"icon\":\"rubber\",\"price\":\"£0.63\",\"cents\":63},{\"name\":\"Glue stick\",\"icon\":\"glue stick\",\"price\":\"£1.54\",\"cents\":154}],\"col\":{\"a\":[0,6,3],\"b\":[1,5,4],\"sum\":[2,1,7],\"carry10\":0,\"carryPounds\":1,\"s1\":7,\"s10\":11},\"coins\":[2,1,7],\"hint\":\"Line up the points: pounds under pounds, 10p under 10p, 1p under 1p. Add the 1p coins first.\",\"reveal\":\"3p and 4p make 7p. Six 10p and five 10p make eleven 10p. Ten 10p coins make £1: one 10p left, and a small 1 under the pounds. £1 and the new £1 make £2. Altogether £2.17.\"},{\"say\":\"Pencil £0.48 + ruler £0.85\",\"answer\":\"£1.33\",\"cents\":133,\"things\":[{\"name\":\"Pencil\",\"icon\":\"pencil\",\"price\":\"£0.48\",\"cents\":48},{\"name\":\"Ruler\",\"icon\":\"ruler\",\"price\":\"£0.85\",\"cents\":85}],\"col\":{\"a\":[0,4,8],\"b\":[0,8,5],\"sum\":[1,3,3],\"carry10\":1,\"carryPounds\":1,\"s1\":13,\"s10\":13},\"coins\":[1,3,3],\"hint\":\"Line up the points: pounds under pounds, 10p under 10p, 1p under 1p. Add the 1p coins first.\",\"reveal\":\"8p and 5p make 13p. Ten 1p coins make 10p: 3p left, and a small 1 under the 10 #fff;border-color:#fff;color:var(--team);font:700 24px/1 Arial,sans-serif}.eg-button.cx-again:hover{background:#f6f2ea}\n.cx-howpanel{max-width:800px;color:#3a4254;font:19px/1.4 Arial,sans-serif}.cx-howpanel h2{margin:0 0 6px;font-size:28px}.cx-howpanel h3{margin:14px 0 4px;color:#5a6172;font-size:18px}.cx-howpanel ol,.cx-howpanel ul{margin:0;padding-left:26px}.cx-howpanel li{margin:3px 0}.cx-howpanel .cx-close{margin-top:16px}\n\n\u003c/style>\n\u003cstyle>\n/* Class games file: the game is one 1280 x 720 slide, scaled by the page around it. */\nhtml,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#fffaf0}\nbody.cg-child #cg-game.eg{margin:0 auto}\n\n\u003c/style>\n\u003c/head>\n\u003cbody class=\"cg-child\">\n\u003cmain id=\"cg-game\">\u003c/main>\n\u003cscript>\nglobalThis.EXPLORE_GAMES = {\"schema\":2,\"games\":{\"Y7-068\":{\"lessonId\":\"Y7-068\",\"code\":\"SB-068\",\"unit\":3,\"block\":\"c\",\"title\":\"Scale a known fact\",\"enabled\":true,\"game\":{\"name\":\"Noughts and crosses: use the fact you know\",\"players\":\"The group, in 2 teams\",\"time\":\"5 minutes\",\"how\":[\"Two teams, X and O. The team in play picks a square. It opens with a fact you know, such as 5 × 6 = 30, and the question, 5 × 600.\",\"Everyone works it out on a whiteboard and says the unit: 5 × 6 hundreds = 30 hundreds, which is 3,000.\",\"One board, picked at random, decides: right claims the square, and either way the turn passes. Three in a row wins.\"],\"board\":{\"kind\":\"noughts\",\"pupils\":\"Use the fact you know. Say the unit.\",\"squares\":[{\"from\":\"5 × 6 = 30\",\"q\":\"5 × 600\",\"a\":\"3,000\"},{\"from\":\"2 × 7 = 14\",\"q\":\"2 × 700\",\"a\":\"1,400\"},{\"from\":\"4 × 5 = 20\",\"q\":\"40 × 5\",\"a\":\"200\"},{\"from\":\"8 × 4 = 32\",\"q\":\"320 ÷ 8\",\"a\":\"40\"},{\"from\":\"6 × 9 = 54\",\"q\":\"5,400 ÷ 9\",\"a\":\"600\"},{\"from\":\"7 × 9 = 63\",\"q\":\"630 ÷ 70\",\"a\":\"9\"},{\"from\":\"7 × 7 = 49\",\"q\":\"7 × 700\",\"a\":\"4,900\"},{\"from\":\"8 × 9 = 72\",\"q\":\"720 ÷ 9\",\"a\":\"80\"},{\"from\":\"6 × 8 = 48\",\"q\":\"6 × 80\",\"a\":\"480\"}],\"endQuestion\":\"In 630 ÷ 70, both numbers are ten times the size of 63 ÷ 7. What happened to the answer?\",\"endAnswer\":\"It stayed 9: there are still 9 groups, because each group is ten times the size too.\",\"title\":\"Noughts and crosses: use the fact you know\"},\"answers\":[\"5 × 600 = 3,000\",\"2 × 700 = 1,400\",\"40 × 5 = 200\",\"320 ÷ 8 = 40\",\"5,400 ÷ 9 = 600\",\"630 ÷ 70 = 9\",\"7 × 700 = 4,900\",\"720 ÷ 9 = 80\",\"6 × 80 = 480\"]},\"cg\":{\"kind\":\"noughts\",\"items\":[{\"from\":\"5 × 6 = 30\",\"q\":\"5 × 600\",\"a\":\"3,000\",\"value\":3000,\"op\":\"×\",\"pic\":{\"type\":\"groups\",\"groups\":5,\"each\":6,\"unit\":100},\"hint\":\"Name the unit: 600 is 6 hundreds. 5 groups of 6 hundreds make how many hundreds?\",\"reveal\":\"5 × 6 hundreds = 30 hundreds, which is 3,000.\"},{\"from\":\"2 × 7 = 14\",\"q\":\"2 × 700\",\"a\":\"1,400\",\"value\":1400,\"op\":\"×\",\"pic\":{\"type\":\"groups\",\"groups\":2,\"each\":7,\"unit\":100},\"hint\":\"Name the unit: 700 is 7 hundreds. 2 groups of 7 hundreds make how many hundreds?\",\"reveal\":\"2 × 7 hundreds = 14 hundreds, which is 1,400.\"},{\"from\":\"4 × 5 = 20\",\"q\":\"40 × 5\",\"a\":\"200\",\"value\":200,\"op\":\"×\",\"pic\":{\"type\":\"groups\",\"groups\":5,\"each\":4,\"unit\":10},\"hint\":\"Name the unit: 40 is 4 tens. 4 tens × 5 make how many tens?\",\"reveal\":\"4 tens × 5 = 20 tens, which is 200.\"},{\"from\":\"8 × 4 = 32\",\"q\":\"320 ÷ 8\",\"a\":\"40\",\"value\":40,\"op\":\"÷\",\"pic\":{\"type\":\"share\",\"groups\":8,\"each\":4,\"unit\":10},\"hint\":\"Name the unit: 320 is 32 tens. Share 32 tens into 8 groups: how many tens in each group?\",\"reveal\":\"32 tens ÷ 8 = 4 tens, which is 40.\"},{\"from\":\"6 × 9 = 54\",\"q\":\"5,400 ÷ 9\",\"a\":\"600\",\"value\":600,\"op\":\"÷\",\"pic\":{\"type\":\"share\",\"groups\":9,\"each\":6,\"unit\":100},\"hint\":\"Name the unit: 5,400 is 54 hundreds. Share 54 hundreds into 9 groups: how many hundreds in each group?\",\"reveal\":\"54 hundreds ÷ 9 = 6 hundreds, which is 600.\"},{\"from\":\"7 × 9 = 63\",\"q\":\"630 ÷ 70\",\"a\":\"9\",\"value\":9,\"op\":\"÷\",\"pic\":{\"type\":\"group\",\"groups\":9,\"each\":7,\"unit\":10},\"hint\":\"Name the unit: 630 is 63 tens and 70 is 7 tens. How many groups of 7 tens?\",\"reveal\":\"63 tens ÷ 7 tens = 9 groups. The answer is 9.\"},{\"from\":\"7 × 7 = 49\",\"q\":\"7 × 700\",\"a\":\"4,900\",\"value\":4900,\"op\":\"×\",\"pic\":{\"type\":\"groups\",\"groups\":7,\"each\":7,\"unit\":100},\"hint\":\"Name the unit: 700 is 7 hundreds. 7 groups of 7 hundreds make how many hundreds?\",\"reveal\":\"7 × 7 hundreds = 49 hundreds, which is 4,900.\"},{\"from\":\"8 × 9 = 72\",\"q\":\"720 ÷ 9\",\"a\":\"80\",\"value\":80,\"op\":\"÷\",\"pic\":{\"type\":\"share\",\"groups\":9,\"each\":8,\"unit\":10},\"hint\":\"Name the unit: 720 is 72 tens. Share 72 tens into 9 groups: how many tens in each group?\",\"reveal\":\"72 tens ÷ 9 = 8 tens, which is 80.\"},{\"from\":\"6 × 8 = 48\",\"q\":\"6 × 80\",\"a\":\"480\",\"value\":480,\"op\":\"×\",\"pic\":{\"type\":\"groups\",\"groups\":6,\"each\":8,\"unit\":10},\"hint\":\"Name the unit: 80 is 8 tens. 6 groups of 8 tens make how many tens?\",\"reveal\":\"6 × 8 tens = 48 tens, which is 480.\"}],\"endQuestion\":\"In 630 ÷ 70, both numbers are ten times the size of 63 ÷ 7. What happened to the answer?\",\"endAnswer\":\"It stayed 9: there are still 9 groups, because each group is ten times the size too.\",\"pupils\":\"Use the fact you know. Say the unit.\",\"screen\":{\"screen\":\"u3c_screen.py\",\"screened\":9,\"left out\":0,\"acceptedBareFacts\":9}}}}};\nglobalThis.CG_CHILD = {\"week\":4,\"lessonId\":\"Y7-068\",\"mode\":\"class\",\"eyebrow\":\"Week 4\"};\n\u003c/script>\n\u003cscript>\n/* Unit 3 class games, weeks 3 to 6: the lessons' printed board games as class games, in the Explore game frame's look\n   (explore-games.css), like Race to zero (week 2).\n     week 3  Y7-109  Sho g-button.cx-scard{position:absolute;width:118px;height:66px;padding:0;transform:translate(-50%,-50%) rotate(var(--tilt,0deg));background:#fff;border:1px solid #c9d3df;border-radius:10px;color:#3a4254;font:700 32px/1 Arial,sans-serif;box-shadow:0 2px 0 #e1d8c6;transition:transform .15s,box-shadow .15s}\n.eg-button.cx-scard:not(:disabled):hover{transform:translate(-50%,-52%) rotate(var(--tilt,0deg)) scale(1.05);box-shadow:0 4px 8px rgba(58,66,84,.15)}\n.eg-button.cx-scard:disabled{opacity:1;cursor:default}\n.eg-button.cx-scard.miss{border:2px dashed #e3a21a;color:#8a5a10}\n.eg-button.cx-scard.hit{background:var(--team);border-color:var(--team);color:#fff;animation:cx-splat .45s cubic-bezier(.3,1.5,.5,1)}\n.cx-blob{position:absolute;left:-26px;top:-30px;width:170px;height:126px;color:var(--team);opacity:.28;z-index:-1;pointer-events:none}\n@keyframes cx-splat{0%{transform:translate(-50%,-50%) rotate(var(--tilt,0deg)) scale(1)}35%{transform:translate(-50%,-50%) rotate(var(--tilt,0deg)) scale(1.25,.7)}100%{transform:translate(-50%,-50%) rotate(var(--tilt,0deg)) scale(1)}}\n.eg-button.cx-scard.cx-target{outline:4px solid var(--cx-gold);outline-offset:3px;animation:cx-glow 1s ease-in-out infinite alternate}\n.cx-bus{display:flex;flex-direction:column;gap:10px;min-height:0;padding:12px 14px;background:#fff;border:1px solid #d3dbe8;border-radius:12px;overflow:hidden}\n.cx-businner{display:flex;flex-direction:column;align-items:center;gap:8px}.cx-bushead{margin:0;color:#5a6172;font:600 17px Arial,sans-serif}.cx-busidle{margin:0;color:#5a6172;text-align:center}\n.cx-stop{display:inline-flex;flex-direction:column;padding:6px 10px}.cx-stoprow{display:grid;grid-template-columns:repeat(4,48px);height:58px;align-items:end;text-align:center;font:700 40px/1 Arial,sans-serif;color:#3a4254}\n.cx-sd{position:relative;display:block;padding-bottom:6px}.cx-quot .cx-sd{color:var(--cx-teal)}\n.cx-divd .cx-sd.cx-divisor{border-right:3px solid #6f8291;padding-right:6px}.cx-divd .cx-under{border-top:3px solid #6f8291;padding-top:6px}\n.cx-small{position:absolute;left:2px;top:4px;color:var(--cx-amber);font-size:20px}\n.cx-busq{margin:0;color:#3a4254;font:700 24px Arial,sans-serif}\n.cx-bus .cx-notes{border-top:1px solid #e3e8ef;padding-top:8px}.cx-bus .cx-note{text-align:left;font-size:16px}\n\n/* covers: the winner in the team's colour, and How to play */\n.cx-cover{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:20px;box-sizing:border-box;background:rgba(255,250,240,.97);animation:cx-coverin .4s ease;overflow:auto}\n.cx-cover.cx-win{background:var(--team);color:#fff}\n@keyframes cx-coverin{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}\n.cx-winpanel{text-align:center;max-width:820px}.cx-flag{width:96px;height:64px;margin:0 auto 10px;border:2px solid #fff;border-radius:4px;background:repeating-conic-gradient(#fff 0 25%,transparent 0 50%) 0 0/24px 24px;animation:cx-wave 1.1s ease-in-out infinite alternate}\n@keyframes cx-wave{from{transform:skewY(-3deg)}to{transform:skewY(3deg)}}\n.eg .cx-winhead{margin:0 0 6px;color:#fff;font:700 42px/1.15 Arial,sans-serif}.cx-winhead:focus{outline:none}.cx-winline{margin:4px 0 10px;font:600 22px/1.3 Arial,sans-serif}\n.cx-wintable{display:grid;gap:6px;min-width:480px;margin:10px auto 12px}.cx-winrow{display:grid;grid-template-columns:1fr auto auto;gap:22px;padding:7px 16px;background:rgba(255,255,255,.16);border-radius:8px;text-align:left;font:600 21px/1.3 Arial,sans-serif}\n.cx-winrow.first{background:#fff;color:var(--row)}\n.cx-endq{margin:6px auto 12px;padding:10px 14px;background:rgba(255,255,255,.14);border-radius:10px;font:18px/1.35 Arial,sans-serif}.cx-endq p{margin:0 0 6px}.cx-endq-a{font-weight:700}\n.eg-button.cx-endshow{background:transparent;border-color:#fff;color:#fff}\n.eg-button.cx-again{min-height:56px;padding:10px 34px;background:#fff;border-color:#fff;color:var(--team);font:700 24px/1 Arial,sans-serif}.eg-button.cx-again:hover{background:#f6f2ea}\n.cx-howpanel{max-width:800px;color:#3a4254;font:19px/1.4 Arial,sans-serif}.cx-howpanel h2{margin:0 0 6px;font-size:28px}.cx-howpanel h3{margin:14px 0 4px;color:#5a6172;font-size:18px}.cx-howpanel ol,.cx-howpanel ul{margin:0;padding-left:26px}.cx-howpanel li{margin:3px 0}.cx-howpanel .cx-close{margin-top:16px}\n\n\u003c/style>\n\u003cstyle>\n/* Class games file: the game is one 1280 x 720 slide, scaled by the page around it. */\nhtml,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#fffaf0}\nbody.cg-child #cg-game.eg{margin:0 auto}\n\n\u003c/style>\n\u003c/head>\n\u003cbody class=\"cg-child\">\n\u003cmain id=\"cg-game\">\u003c/main>\n\u003cscript>\nglobalThis.EXPLORE_GAMES = {\"schema\":2,\"games\":{\"Y7-056\":{\"lessonId\":\"Y7-056\",\"code\":\"SB-056\",\"unit\":3,\"block\":\"c\",\"title\":\"Split a multiplication\",\"enabled\":true,\"game\":{\"name\":\"True or false: is every part multiplied?\",\"players\":\"The group, in 2 teams\",\"time\":\"5 minutes\",\"how\":[\"A statement comes up on the screen, such as 17 × 4 = 40 + 28. Everyone checks it on a whiteboard: one part at a time.\",\"Write T for true or F for false, and show on 3. Then press Reveal: the grid or the counters show why.\",\"A right board scores a point for its team. For a false one, say the right calculation.\"],\"board\":{\"kind\":\"truefalse\",\"items\":[{\"say\":\"17 × 4 = 40 + 28.\",\"true\":true,\"why\":\"10 × 4 = 40 and 7 × 4 = 28: both parts are multiplied, so 17 × 4 = 68.\",\"draw\":[{\"type\":\"area\",\"top\":[10,7],\"side\":[4],\"working\":true,\"total\":\"40 + 28 = 68\"}]},{\"say\":\"16 × 5 = 50 + 6.\",\"true\":false,\"why\":\"The 6 is not multiplied. 10 × 5 = 50 and 6 × 5 = 30, so 16 × 5 = 50 + 30 = 80.\",\"draw\":[{\"type\":\"area\",\"top\":[10,6],\"side\":[5],\"working\":true,\"total\":\"50 + 30 = 80\"}]},{\"say\":\"53 × 3 = 150 + 9.\",\"true\":true,\"why\":\"50 × 3 = 150 and 3 × 3 = 9: both parts are multiplied, so 53 × 3 = 159.\",\"draw\":[{\"type\":\"area\",\"top\":[50,3],\"side\":[3],\"working\":true,\"total\":\"150 + 9 = 159\"}]},{\"say\":\"59 × 2 = 120 − 1.\",\"true\":false,\"why\":\"Take away one 2, not 1: 60 × 2 = 120, so 59 × 2 = 120 − 2 = 118.\"},{\"say\":\"64 × 2 = 120 + 8.\",\"true\":true,\"why\":\"60 × 2 = 120 and 4 × 2 = 8: both parts are multiplied, so 64 × 2 = 128.\",\"draw\":[{\"type\":\"area\",\"top\":[60,4],\"side\":[2],\"working\":true,\"total\":\"120 + 8 = 128\"}]},{\"say\":\"39 × 5 = 200 − 5.\",\"true\":true,\"why\":\"40 × 5 = 200, and 39 is one less than 40 in every row, so take away one 5: 195.\",\"draw\":[{\"type\":\"u3split\",\"rows\":5,\"top\":[39,1],\"equation\":\"200 − 5 = 195\"}]},{\"say\":\"34 × 6 = 180 + 4.\",\"true\":false,\"why\":\"The 4 is not multiplied. 30 × 6 = 180 and 4 × 6 = 24, so 34 × 6 = 180 + 24 = 204.\",\"draw\":[{\"type\":\"area\",\"top\":[30,4],\"side\":[6],\"working\":true,\"total\":\"180 + 24 = 204\"}]},{\"say\":\"41 × 5 = 200 + 1.\",\"true\":false,\"why\":\"The 1 is not multiplied. 40 × 5 = 200 and 1 × 5 = 5, so 41 × 5 = 200 + 5 = 205.\",\"draw\":[{\"type\":\"area\",\"top\":[40,1],\"side\":[5],\"working\":true,\"total\":\"200 + 5 = 205\"}]}],\"endQuestion\":\"What mistake made the false statements false?\",\"endAnswer\":\"A part was not multiplied: the ones were left as they were, or 1 was taken away instead of one whole group.\",\"title\":\"True or false: is every part multiplied?\"},\"answers\":[\"True: 10 × 4 = 40 and 7 × 4 = 28: both parts are multiplied, so 17 × 4 = 68.\",\"False: The 6 is not multiplied. 10 × 5 = 50 and 6 × 5 = 30, so 16 × 5 = 50 + 30 = 80.\",\"True: 50 × 3 = 150 and 3 × 3 = 9: both parts are multiplied, so 53 × 3 = 159.\",\"False: Take away one 2, not 1: 60 × 2 = 120, so 59 × 2 = 120 − 2 = 118.\",\"True: 60 × 2 = 120 and 4 × 2 = 8: both parts are multiplied, so 64 × 2 = 128.\",\"True: 40 × 5 = 200, and 39 is one less than 40 in every row, so take away one 5: 195.\",\"False: The 4 is not multiplied. 30 × 6 = 180 and 4 × 6 = 24, so 34 × 6 = 180 + 24 = 204.\",\"False: The 1 is not multiplied. 40 × 5 = 200 and 1 × 5 = 5, so 41 × 5 = 200 + 5 = 205.\"]},\"cg\":{\"kind\":\"truefalse\",\"items\":[{\"say\":\"17 × 4 = 40 + 28.\",\"true\":true,\"why\":\"10 × 4 = 40 and 7 × 4 = 28: both parts are multiplied, so 17 × 4 = 68.\",\"left\":\"17 × 4\",\"value\":68,\"pic\":{\"type\":\"area\",\"top\":[10,7],\"side\":[4],\"products\":[[40,28]],\"total\":\"40 + 28 = 68\"},\"hint\":\"Every part is multiplied. Check one part at a time: is every part multiplied?\"},{\"say\":\"16 × 5 = 50 + 6.\",\"true\":false,\"why\":\"The 6 is not multiplied. 10 × 5 = 50 and 6 × 5 = 30, so 16 × 5 = 50 + 30 = 80.\",\"left\":\"16 × 5\",\"value\":80,\"pic\":{\"type\":\"area\",\"top\":[10,6],\"side\":[5],\"products\":[[50,30]],\"total\":\"50 + 30 = 80\"},\"hint\":\"Every part is multiplied. Check one part at a time: is every part multiplied?\"},{\"say\":\"53 × 3 = 150 + 9.\",\"true\":true,\"why\":\"50 × 3 = 150 and 3 × 3 = 9: both parts are multiplied, so 53 × 3 = 159.\",\"left\":\"53 × 3\",\"value\":159,\"pic\":{\"type\":\"area\",\"top\":[50,3],\"side\":[3],\"products\":[[150,9]],\"total\":\"150 + 9 = 159\"},\"hint\":\"Every part is multiplied. Check one part at a time: is every part multiplied?\"},{\"say\":\"59 × 2 = 120 − 1.\",\"true\":false,\"why\":\"Take away one 2, not 1: 60 × 2 = 120, so 59 × 2 = 120 − 2 = 118.\",\"left\":\"59 × 2\",\"value\":118,\"pic\":{\"type\":\"split\",\"rows\":2,\"top\":[59,1],\"equation\":\"120 − 2 = 118\"},\"hint\":\"Every part is multiplied. Check one part at a time: is every part multiplied?\"},{\"say\":\"64 × 2 = 120 + 8.\",\"true\":true,\"why\":\"60 × 2 = 120 and 4 × 2 = 8: both parts are multiplied, so 64 × 2 = 128.\",\"left\":\"64 × 2\",\"value\":128,\"pic\":{\"type\":\"area\",\"top\":[60,4],\"side\":[2],\"products\":[[120,8]],\"total\":\"120 + 8 = 128\"},\"hint\":\"Every part is multiplied. Check one part at a time: is every part multiplied?\"},{\"say\":\"39 × 5 = 200 − 5.\",\"true\":true,\"why\":\"40 × 5 = 200, and 39 is one less than 40 in every row, so take away one 5: 195.\",\"left\":\"39 × 5\",\"value\":195,\"pic\":{\"type\":\"split\",\"rows\":5,\"top\":[39,1],\"equation\":\"200 − 5 = 195\"},\"hint\":\"Every part is multiplied. Check one part at a time: is every part multiplied?\"},{\"say\":\"34 × 6 = 180 + 4.\",\"true\":false,\"why\":\"The 4 is not multiplied. 30 × 6 = 180 and 4 × 6 = 24, so 34 × 6 = 180 + 24 = 204.\",\"left\":\"34 × 6\",\"value\":204,\"pic\":{\"type\":\"area\",\"top\":[30,4],\"side\":[6],\"products\":[[180,24]],\"total\":\"180 + 24 = 204\"},\"hint\":\"Every part is multiplied. Check one part at a time: is every part multiplied?\"},{\"say\":\"41 × 5 = 200 + 1.\",\"true\":false,\"why\":\"The 1 is not multiplied. 40 × 5 = 200 and 1 × 5 = 5, so 41 × 5 = 200 + 5 = 205.\",\"left\":\"41 × 5\",\"value\":205,\"pic\":{\"type\":\"area\",\"top\":[40,1],\"side\":[5],\"products\":[[200,5]],\"total\":\"200 + 5 = 205\"},\"hint\":\"Every part is multiplied. Check one part at a time: is every part multiplied?\"}],\"hint\":\"Every part is multiplied. Check one part at a time: is every part multiplied?\",\"endQuestion\":\"What mistake made the false statements false?\",\"endAnswer\":\"A part was not multiplied: the ones were left as they were, or 1 was taken away instead of one whole group.\",\"screen\":{\"screen\":\"u3c_screen.py\",\"screened\":8,\"left out\":0,\"acceptedBareFacts\":5}}}}};\nglobalThis.CG_CHILD = {\"week\":5,\"lessonId\":\"Y7-056\",\"mode\":\"class\",\"eyebrow\":\"Week 5\"};\n\u003c/script>\n\u003cscript>\n/* Unit 3 class games, weeks 3 to 6: the lessons' printed board games as class games, in the Explore game frame's look\n   (explore-games.css), like Race to zero (week 2).\n     week 3  Y7-109  Shopping bingo           bingo      add two prices in columns; every card with the total crosses it\n     week 4  Y7-068  Noughts and crosses      noughts    pick a square; use the fact you know; right claims it\n     week 5  Y7-056  True or false            truefalse  is every part multiplied? the grid shows why\n     week 6  Y7-065  Splat! Short division    splat      work it out, then splat the answer card; the bus stop shows why\n   One calculation per turn; a wrong answer gets one hint in the lesson's words, then the answer (true or false has no\n   second try: its hint is a button before choosing). 1 player, 2 players, or Class with 2 to 4 teams and team points.\n   Data: root.EXPLORE_GAMES.games[lid] with `cg`, the items cg_items.py built from the lesson and screened.\n   ClassGames.mount(parent, lid, navigate, opts) mirrors ExploreGames.mount and RaceGame.mount. */\n(function (root) {\n  'use strict';\n  var doc = root.document, active = null;\n  var COLOURS = ['#4a6fa5', '#c36129', '#8057a2', '#27805a'], DRAW = '#176f70';\n  var reduced = !!(root.matchMedia && root.matchMedia('(prefers-reduced-motion: reduce)').matches);\n  var MINUS = '−', TIMES = '×', DIVIDE = '÷';\n  var LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];\n\n  // ------------------------------------------------------------------ pure helpers (tested in node)\n  function shuffle(a, rand) { a = a.slice(); rand = rand || Math.random; for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rand() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }\n  function range(n) { var a = []; for (var i = 0; i \u003c n; i++) a.push(i); return a; }\n  function commas(n) { return String(n).replace(/\\B(?=(\\d{3})+(?!\\d))/g, ','); }\n  function pounds(c) { return '£' + Math.floor(c / 100) + '.' + ('0' + c % 100).slice(-2); }\n  function parseMoney(t) { t = String(t).replace(/^£/, ''); if (!/^\\d*\\.?\\d{0,2}$/.test(t) || !/\\d/.test(t)) return null; return Math.round(parseFloat(t) * 100); }\n  function parseNumber(t) { t = String(t).replace(/,/g, ''); return /^\\d+$/.test(t) ? Number(t) : null; }\n  function lineOf(owner, who) { for (var i = 0; i \u003c LINES.length; i++) { var L = LINES[i]; if (owner[L[0]] === who && owner[L[1]] === who && owner[L[2]] === who) return L; } return null; }\n  function bingoLine(crossed) { for (var i = 0; i \u003c LINES.length; i++) { var L = LINES[i]; if (crossed[L[0]] && crossed[L[1]] && crossed[L[2]]) return L; } return null; }\n  function fullRounds(n, sides) { return sides > 1 ? n - n % sides : n; }\n  function leaders(points, n) { var best = Math.max.apply(null, points.slice(0, n)), out = []; for (var i = 0; i \u003c n; i++) if (points[i] === best) out.push(i); return out; }\n\n  function el(tag, cls, text) { var e = doc.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }\n  function btn(text, cls, fn) { var e = el('button', 'eg-button ' + (cls || ''), text); e.type = 'button'; e.onclick = fn; return e; }\n  function svg(html, cls, view) { var s = doc.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', view || '0 0 80 48'); s.setAttribute('aria-hidden', 'true'); if (cls) s.setAttribute('class', cls); s.innerHTML = html; return s; }\n  function load(key) { try { var n = Number(root.localStorage.getItem(key)); return Number.isFinite(n) && n >= 0 ? n : 0; } catch (_) { return 0; } }\n  function save(key, value) { try { root.localStorage.setItem(key, String(value)); } catch (_) {} }\n  function saveSound(on) { try { root.localStorage.setItem('mathslab-classgames-sound', on ? 'on' : 'off'); } catch (_) {} }\n\n  // shop things, drawn plainly (no faces): the lesson's school shop\n  var THINGS = {\n    pencil: '\u003cpath d=\"M10 18h50v12H10z\" fill=\"#f2b544\" stroke=\"#b7791f\"/>\u003cpath d=\"M60 18l14 6-14 6z\" fill=\"#efe6d4\" stroke=\"#b7791f\"/>\u003cpath d=\"M70 22.3l4 1.7-4 1.7z\" fill=\"#4a5163\"/>\u003cpath d=\"M4 18h6v12H4z\" fill=\"#e3c7b8\" stroke=\"#a8714a\"/>',\n    ruler: '\u003crect x=\"4\" y=\"15\" width=\"72\" height=\"18\" rx=\"2\" fill=\"#f4e7c5\" stroke=\"#a8714a\"/>\u003cpath d=\"M12 15v7M20 15v4M28 15v7M36 15v4M44 15v7M52 15v4M60 15v7M68 15v4\" stroke=\"#a8714a\"/>',\n    rubber: '\u003crect x=\"16\" y=\"14\" width=\"48\" height=\"20\" rx=\"4\" fill=\"#fff\" stroke=\"#6f8291\"/>\u003cpath d=\"M40 14h20a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H40z\" fill=\"#9fd3cd\" stroke=\"#176f70\"/>',\n    'glue stick': '\u003crect x=\"30\" y=\"8\" width=\"20\" height=\"34\" rx=\"3\" fill=\"#d9f0ed\" stroke=\"#176f70\"/>\u003crect x=\"30\" y=\"8\" width=\"20\" height=\"11\" rx=\"3\" fill=\"#176f70\"/>',\n    notebook: '\u003crect x=\"20\" y=\"6\" width=\"42\" height=\"36\" rx=\"2\" fill=\"#c9d7e8\" stroke=\"#4a6fa5\"/>\u003cpath d=\"M26 12v24\" stroke=\"#4a6fa5\"/>\u003ccircle cx=\"20\" cy=\"12\" r=\"2\" fill=\"#4a6fa5\"/>\u003ccircle cx=\"20\" cy=\"20\" r=\"2\" fill=\"#4a6fa5\"/>\u003ccircle cx=\"20\" cy=\"28\" r=\"2\" fill=\"#4a6fa5\"/>\u003ccircle cx=\"20\" cy=\"36\" r=\"2\" fill=\"#4a6fa5\"/>',\n    'pencil case': '\u003crect x=\"6\" y=\"12\" width=\"68\" height=\"24\" rx=\"11\" fill=\"#e6dcf0\" stroke=\"#8057a2\"/>\u003cpath d=\"M12 19h56\" stroke=\"#8057a2\" stroke-dasharray=\"3 2\"/>\u003crect x=\"62\" y=\"16\" width=\"6\" height=\"7\" rx=\"1\" fill=\"#8057a2\"/>',\n    pen: '\u003crect x=\"8\" y=\"20\" width=\"58\" height=\"8\" rx=\"4\" fill=\"#4a6fa5\"/>\u003cpath d=\"M66 21l10 3-10 3z\" fill=\"#3a4254\"/>\u003cpath d=\"M16 20v-4h22v4\" fill=\"none\" stroke=\"#3a4254\" stroke-width=\"2\"/>',\n    sharpener: '\u003crect x=\"24\" y=\"12\" width=\"32\" height=\"24\" rx=\"4\" fill=\"#d3dbe8\" stroke=\"#6f8291\"/>\u003ccircle cx=\"40\" cy=\"24\" r=\"6\" fill=\"#fff\" stroke=\"#6f8291\"/>\u003cpath d=\"M40 18v12\" stroke=\"#6f8291\"/>'\n  };\n  var MARKS = [\n    '\u003cpath d=\"M18 18l44 44M62 18L18 62\" stroke=\"currentColor\" stroke-width=\"10\" stroke-linecap=\"round\" fill=\"none\"/>',\n    '\u003ccircle cx=\"40\" cy=\"40\" r=\"24\" stroke=\"currentColor\" stroke-width=\"9\" fill=\"none\"/>',\n    '\u003cpath d=\"M40 14l28 50H12z\" stroke=\"currentColor\" stroke-width=\"8\" stroke-linejoin=\"round\" fill=\"none\"/>',\n    '\u003crect x=\"16\" y=\"16\" width=\"48\" height=\"48\" rx=\"4\" stroke=\"currentColor\" stroke-width=\"9\" fill=\"none\"/>'];\n  var MARK_NAMES = ['X', 'O', 'Triangle', 'Square'];\n\n  // ------------------------------------------------------------------ the frame every game shares\n  function mount(parent, lid, navigate, opts) {\n    var data = ((root.EXPLORE_GAMES || {}).games || {})[lid];\n    if (!data || !data.enabled || !data.cg || !KINDS[data.cg.kind]) throw new Error('This class game is not enabled or has no items');\n    opts = opts || {};\n    if (active) active.destroy();\n    var cg = data.cg, kind = cg.kind;\n    parent.textContent = ''; parent.className = 'eg cx cx-' + kind;\n    var destroyed = false, timers = [], fxTimers = [], epoch = 0, ac = null, noiseBuf = null, key = 'mathslab-game-' + lid + '-';\n    var s = { lessonId: lid, kind: kind, mode: 'solo', nTeams: 2, names: ['Team 1', 'Team 2', 'Team 3', 'Team 4'], points: [0, 0, 0, 0], turn: 0,\n      over: false, sound: true, streak: 0, best: load(key + 'best'), rights: 0, slips: 0, hints: 0, reveals: 0, history: [], result: null };\n    var K = { s: s, data: data, cg: cg, entry: null };\n\n    var header = el('header', 'eg-header'), heading = el('div');\n    heading.appendChild(el('p', 'eg-eyebrow', (opts.eyebrow ? opts.eyebrow + ' · ' : '') + data.code + ' · ' + data.title));\n    var title = el('h1', '', (data.game.name.split(': ')[0])); title.tabIndex = -1; heading.appendChild(title);\n    header.appendChild(btn(opts.backLabel || 'Games', 'eg-back', function () { navigate('#games'); }));\n    header.appendChild(heading);\n    header.appendChild(btn('How to play', 'cx-howbtn', function () { showHow(true); }));\n    if (opts.onFullscreen) header.appendChild(btn('Full screen', 'cx-fs', opts.onFullscreen));\n    header.appendChild(btn('Play again', 'eg-restart', function () { restart(); }));\n    parent.appendChild(header);\n    var bar = el('div', 'eg-bar cx-bar'); parent.appendChild(bar);\n    var modes = el('div', 'eg-modes'); modes.setAttribute('role', 'group'); modes.setAttribute('aria-label', 'Who is playing'); bar.appendChild(modes);\n    ['solo', 'two', 'class'].forEach(function (m, i) { var b = btn(['1 player', '2 players', 'Class'][i], '', function () { s.mode = m; s.sound = true; restart(); }); b.dataset.mode = m; modes.appendChild(b); });\n    var hud = el('div', 'eg-hud cx-hud'); bar.appendChild(hud);\n    var progress = el('span', 'cx-progress'); bar.appendChild(progress);\n    var sound = btn('Sound on', 'eg-sound cx-sound', function () { s.sound = !s.sound; saveSound(s.sound); drawBar(); if (s.sound) sfx('tick'); }); bar.appendChild(sound);\n    var body = el('div', 'eg-body cx-body'), play = el('section', 'eg-play cx-play'), teams = el('aside', 'eg-teams cx-teams');\n    teams.setAttribute('aria-label', 'Team points'); body.appendChild(play); body.appendChild(teams); parent.appendChild(body);\n    var board = el('div', 'cx-board'); play.appendChild(board);\n    var cover = el('div', 'cx-cover'); cover.hidden = true;\n    var feedback = el('p', 'eg-feedback'); feedback.setAttribute('role', 'status'); feedback.setAttribute('aria-live', 'polite'); parent.appendChild(feedback);\n    var keyhelp = el('p', 'eg-keyhelp', ''); parent.appendChild(keyhelp);\n    K.board = board;\n\n    function later(fn, ms) { var token = epoch; timers.push(root.setTimeout(function () { if (!destroyed && token === epoch) fn(); }, reduced ? Math.min(ms, 60) : ms)); }\n    function cancel() { epoch++; timers.forEach(root.clearTimeout); timers = []; }\n    function fx(fn, ms) { fxTimers.push(root.setTimeout(function () { if (!destroyed) fn(); }, reduced ? 0 : ms)); }\n    function stopFx() { fxTimers.forEach(root.clearTimeout); fxTimers = []; }\n    function sides() { return s.mode === 'solo' ? 1 : s.mode === 'two' ? 2 : s.nTeams; }\n    function name(i) { return s.mode === 'solo' ? 'You' : s.mode === 'two' ? 'Player ' + (i + 1) : s.names[i]; }\n    function goName(i) { retur x}.eg-button.cx-check:hover{background:#3b5b8a}.eg-button.cx-check:disabled{opacity:.45;background:#4a6fa5}\n.cx-dealt{animation:cx-deal .4s ease}\n@keyframes cx-deal{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:none}}\n@keyframes cx-pop{40%{transform:scale(1.12)}}@keyframes cx-in-k{from{opacity:0;transform:translateY(-8px) scale(.8)}to{opacity:1;transform:none}}\n.cx-in{animation:cx-in-k .35s ease both}\n\n/* team points beside the board */\n.cx-teaminfo{flex:1;min-width:0;display:flex;flex-direction:column}.cx-on{color:#5a6172;font-size:15px}.cx-playername{color:var(--team);font:600 22px Arial,sans-serif}\n.eg.cx .eg-team strong{min-width:30px;text-align:right;display:inline-block}.cx-bump{animation:cx-pop .5s ease}\n\n/* week 3: Shopping bingo */\n.cx-board-bingo{grid-template-columns:490px minmax(0,1fr)}.cx-board-bingo .cx-tag{display:none}.cx-board-bingo .cx-note{font-size:16px}\n.cx-shop{display:flex;align-items:center;justify-content:center;gap:12px;min-height:118px}\n.cx-thing{display:flex;flex-direction:column;align-items:center;gap:3px;width:150px}.cx-thingpic{width:96px;height:58px}\n.cx-thingname{color:#3a4254;font:600 17px/1.2 Arial,sans-serif}.cx-price{padding:2px 12px;background:#fdf6e3;border:1px solid var(--cx-gold);border-radius:6px 16px 16px 6px;color:#3a4254;font:700 22px/1.3 Arial,sans-serif}\n.cx-plus{color:#5a6172;font:700 34px Arial,sans-serif}\n.cx-colpic{display:flex;justify-content:center;min-height:118px}\n.cx-col{display:inline-flex;flex-direction:column;padding:4px 10px;background:#f4f8f8;border:1px solid #a9b8c3;border-radius:8px}\n.cx-colrow{display:grid;grid-template-columns:22px repeat(5,30px);align-items:center;font:700 25px/30px Arial,sans-serif;color:#3a4254;text-align:center}\n.cx-colrow .cx-pt{font-size:25px}.cx-colhead{font:600 12px/16px Arial,sans-serif;color:#6f8291}.cx-sumrow{border-top:2px solid #6f8291;margin-top:2px}\n.cx-carry{font:700 15px/16px Arial,sans-serif;color:var(--cx-amber)}\n.cx-coins{display:flex;align-items:center;justify-content:center;gap:18px;min-height:60px}.cx-stack{display:flex}.cx-stack .cx-coin+.cx-coin{margin-left:-18px}\n.cx-coin{display:grid;place-items:center;border-radius:50%;box-sizing:border-box;font:700 14px Arial,sans-serif;color:#3a4254;animation:cx-drop .4s cubic-bezier(.3,1.4,.5,1) both}\n.cx-pound{width:50px;height:50px;background:#f6e7b0;border:2px solid #b7791f}.cx-ten{width:42px;height:42px;background:#eef1f4;border:2px solid #8794a3}.cx-penny{width:32px;height:32px;background:#f3d9c3;border:2px solid #a8714a;font-size:12px}\n@keyframes cx-drop{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}\n.cx-cards{display:grid;gap:12px;align-content:center;justify-content:center;grid-template-columns:repeat(2,minmax(0,250px));min-height:0}\n.cx-cards[data-n=\"1\"]{grid-template-columns:minmax(0,520px)}\n.cx-card{padding:8px 10px 10px;background:#fff;border:1px solid #d3dbe8;border-top:5px solid var(--team);border-radius:10px}\n.cx-cardname{margin:0 0 6px;color:var(--team);font:700 19px/1.2 Arial,sans-serif;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}\n.cx-cardgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}\n.cx-cell{position:relative;display:grid;place-items:center;height:58px;background:#f7f9fc;border:1px solid #d3dbe8;border-radius:7px;color:#3a4254;font:700 20px Arial,sans-serif}\n.cx-cards[data-n=\"1\"] .cx-cell{height:96px;font-size:30px}.cx-cards[data-n=\"2\"] .cx-cell{height:72px;font-size:22px}.cx-cards[data-n=\"3\"],.cx-cards[data-n=\"4\"]{gap:8px}.cx-cards[data-n=\"3\"] .cx-card,.cx-cards[data-n=\"4\"] .cx-card{padding:5px 8px 7px}.cx-cards[data-n=\"3\"] .cx-cardname,.cx-cards[data-n=\"4\"] .cx-cardname{margin-bottom:4px;font-size:17px}.cx-cards[data-n=\"3\"] .cx-cardgrid,.cx-cards[data-n=\"4\"] .cx-cardgrid{gap:4px}.cx-cards[data-n=\"3\"] .cx-cell,.cx-cards[data-n=\"4\"] .cx-cell{height:46px;font-size:18px}\n.cx-cell.crossed{background:color-mix(in srgb,var(--team) 16%,#fff);color:#5a6172}\n.cx-cell.crossed:after{content:'';position:absolute;inset:8px;background:linear-gradient(to top right,transparent calc(50% - 1.5px),var(--team) calc(50% - 1.5px) calc(50% + 1.5px),transparent calc(50% + 1.5px))}\n.cx-stamp{animation:cx-pop .45s ease}.cx-cell.cx-line{outline:3px solid var(--cx-gold);outline-offset:-1px;animation:cx-glow 1s ease-in-out infinite alternate}\n@keyframes cx-glow{to{box-shadow:0 0 0 5px rgba(242,181,68,.35)}}\n\n/* week 4: Noughts and crosses */\n.cx-board-noughts{grid-template-columns:auto minmax(0,1fr);align-items:center}\n.cx-nac{display:grid;grid-template-columns:repeat(3,136px);grid-auto-rows:118px;gap:8px;--team:#4a6fa5}\n.eg-button.cx-sq{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px;background:#fff;border:1px solid #c9d3df;border-radius:12px;color:#3a4254;font:700 26px/1.15 Arial,sans-serif;transition:transform .15s,border-color .15s}\n.cx-nac.picking .eg-button.cx-sq:not(:disabled):hover{border-color:var(--team);transform:translateY(-2px)}\n.eg-button.cx-sq:disabled{cursor:default;opacity:1;color:#3a4254}\n.eg-button.cx-sq.open{outline:4px solid var(--team);outline-offset:-2px;background:#f7f9fc}\n.eg-button.cx-sq.own{background:color-mix(in srgb,var(--team) 10%,#fff)}.cx-sq.own .cx-sqq{font-size:16px;color:#5a6172}\n.cx-mark{width:64px;height:64px;color:var(--team);animation:cx-stampin .4s cubic-bezier(.3,1.5,.5,1)}\n@keyframes cx-stampin{from{opacity:0;transform:scale(1.8)}to{opacity:1;transform:none}}\n.eg-button.cx-sq.cx-line{background:#fdf3dc;animation:cx-glow 1s ease-in-out infinite alternate}\n.cx-counters{display:flex;flex-direction:column;align-items:center;gap:6px}.cx-legend{display:flex;align-items:center;gap:10px;color:#5a6172;font:600 17px Arial,sans-serif}\n.cx-groups{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}.cx-group{display:grid;grid-template-columns:repeat(2,14px);gap:3px;padding:5px;background:#f4f8f8;border:1px solid #a9b8c3;border-radius:8px}\n.cx-ctr{display:block;width:14px;height:14px;box-sizing:border-box;border-radius:50%;animation:cx-in-k .3s ease both}.cx-ctr.t{background:var(--cx-tealf);border:1px solid var(--cx-teal)}.cx-ctr.h{background:var(--cx-amberf);border:1px solid var(--cx-amber)}\n.cx-ctr.big{display:grid;place-items:center;width:44px;height:44px;font:700 14px Arial,sans-serif;color:#3a4254;animation:none}.cx-picnote{margin:0;color:#5a6172;font-size:15px}\n.cx-linked{display:flex;flex-direction:column;align-items:center;gap:2px}.cx-fact{margin:0;color:#5a6172;font:700 24px/1.25 Arial,sans-serif}.cx-fact.cx-new{color:#3a4254;font-size:22px;text-align:center;animation:cx-in-k .4s ease .2s both}.cx-down{width:30px;height:28px}\n\n/* week 5: True or false */\n.cx-board-truefalse{grid-template-columns:minmax(0,1fr)}\n.cx-tfask{display:grid;grid-template-columns:minmax(0,1fr) 250px;grid-template-areas:\"who who\" \"tag tag\" \"q q\" \"pic controls\" \"notes notes\";align-content:center;gap:8px 18px}\n.cx-tfask .cx-who{grid-area:who}.cx-tfask .cx-tag{grid-area:tag}.cx-tfask .cx-q{grid-area:q}.cx-tfask .cx-pic{grid-area:pic}.cx-tfask .cx-controls{grid-area:controls;flex-direction:column}.cx-tfask .cx-notes{grid-area:notes}\n.eg.cx .cx-q.cx-statement{font-size:46px}\n.eg-button.cx-tf{width:220px;min-height:70px;font:700 30px/1 Arial,sans-serif}.eg-button.cx-true{background:#e2f3e8;border-color:#278f50;color:#146c3c}.eg-button.cx-false{background:#fcf0d2;border-color:#e3a21a;color:#8a5a10}\n.eg-button.cx-tf:hover{filter:brightness(.97)}.eg-button.cx-tf:disabled{opacity:.55}.eg-button.cx-tf.right{opacity:1;outline:4px solid #278f50;animation:cx-pop .4s ease}.eg-button.cx-tf.wrongpick{opacity:1;outline:3px dashed #8a5a10}\n.eg-button.cx-hintbtn{width:220px}\n.cx-verdict{padding:4px 16px;border-radius:10px;font:700 30px/1.2 Arial,sans-serif;animation:cx-stampin .45s cubic-bezier(.3,1.5,.5,1)}.cx-verdict.is-true{background:#e2f3e8;color:#146c3c;border:1px solid #278f50}.cx-verdict.is-false{background:#fcf0d2;color:#8a5a10;border:1px solid #e3a21a}\n.cx-gridpic{display:flex;justify-content:center}.cx-grid{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:620px}\n.cx-gridtable{display:grid;width:100%;grid-auto-rows:minmax(54px,auto);border:1px solid #a9b8c3;border-radius:8px;overflow:hidden;background:#f4f8f8}\n.cx-gh{display:grid;place-items:center;padding:4px;background:#eef3f2;color:#3a4254;font:700 22px Arial,sans-serif;border-right:1px solid #c9d3df;border-bottom:1px solid #c9d3df}\n.cx-gc{display:grid;place-items:center;min-height:86px;padding:4px;background:var(--cx-tealf);border-right:1px solid var(--cx-teal);color:#3a4254;font:700 28px Arial,sans-serif}\n.cx-gc.cx-take{background:repeating-linear-gradient(45deg,#fdf6e3 0 6px,#fff 6px 12px);color:#8a5a10}.cx-gh.cx-gk{color:#8a5a10}\n.cx-gridtotal{margin:0;color:#3a4254;font:700 26px Arial,sans-serif}\n\n/* week 6: Splat! */\n.cx-board-splat{grid-template-columns:minmax(0,1fr) 300px}\n.cx-splatleft{display:flex;flex-direction:column;gap:10px;min-height:0}\n.cx-ask.cx-callbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:\"who q controls\" \"tag q controls\";align-items:center;gap:2px 16px;padding:8px 14px}\n.cx-callbar .cx-who{grid-area:who;text-align:left}.cx-callbar .cx-tag{grid-area:tag;text-align:left}.cx-callbar .cx-q{grid-area:q;font-size:44px}.cx-callbar .cx-controls{grid-area:controls}.cx-callbar .cx-pic{display:none}\n.cx-callbar .eg-button.cx-go{min-height:58px;font-size:24px;padding:8px 24px}\n.cx-field{position:relative;flex:1;min-height:0;background:#f4f1ea;border:1px solid #e1d8c6;border-radius:12px;overflow:hidden}\n.eg-button.cx-scard{position:absolute;width:118px;height:66px;padding:0;transform:translate(-50%,-50%) rotate(var(--tilt,0deg));background:#fff;border:1px solid #c9d3df;border-radius:10px;color:#3a4254;font:700 32px/1 Arial,sans-serif;box-shadow:0 2px 0 #e1d8c6;transition:transform .15s,box-shadow .15s}\n.eg-button.cx-scard:not(:disabled):hover{transform:translate(-50%,-52%) rotate(var(--tilt,0deg)) scale(1.05);box-shadow:0 4px 8px rgba(58,66,84,.15)}\n.eg-button.cx-scard:disabled{opacity:1;cursor:default}\n.eg-button.cx-scard.miss{border:2px dashed #e3a21a;color:#8a5a10}\n.eg-button.cx-scard.hit{background:var(--team);border-color:var(--team);color:#fff;animation:cx-splat .45s cubic-bezier(.3,1.5,.5,1)}\n.cx-blob{position:absolute;left:-26px;top:-30px;width:170px;height:126px;color:var(--team);opacity:.28;z-index:-1;pointer-events:none}\n@keyframes cx-splat{0%{transform:translate(-50%,-50%) rotate(var(--tilt,0deg)) scale(1)}35%{transform:translate(-50%,-50%) rotate(var(--tilt,0deg)) scale(1.25,.7)}100%{transform:translate(-50%,-50%) rotate(var(--tilt,0deg)) scale(1)}}\n.eg-button.cx-scard.cx-target{outline:4px solid var(--cx-gold);outline-offset:3px;animation:cx-glow 1s ease-in-out infinite alternate}\n.cx-bus{display:flex;flex-direction:column;gap:10px;min-height:0;padding:12px 14px;background:#fff;border:1px solid #d3dbe8;border-radius:12px;overflow:hidden}\n.cx-businner{display:flex;flex-direction:column;align-items:center;gap:8px}.cx-bushead{margin:0;color:#5a6172;font:600 17px Arial,sans-serif}.cx-busidle{margin:0;color:#5a6172;text-align:center}\n.cx-stop{display:inline-flex;flex-direction:column;padding:6px 10px}.cx-stoprow{display:grid;grid-template-columns:repeat(4,48px);height:58px;align-items:end;text-align:center;font:700 40px/1 Arial,sans-serif;color:#3a4254}\n.cx-sd{position:relative;display:block;padding-bottom:6px}.cx-quot .cx-sd{color:var(--cx-teal)}\n.cx-divd .cx-sd.cx-divisor{border-right:3px solid #6f8291;padding-right:6px}.cx-divd .cx-under{border-top:3px solid #6f8291;padding-top:6px}\n.cx-small{position:absolute;left:2px;top:4px;color:var(--cx-amber);font-size:20px}\n.cx-busq{margin:0;color:#3a4254;font:700 24px Arial,sans-serif}\n.cx-bus .cx-notes{border-top:1px solid #e3e8ef;padding-top:8px}.cx-bus .cx- cx-howpanel .cx-close{margin-top:16px}\n\n\u003c/style>\n\u003cstyle>\n/* Class games file: the game is one 1280 x 720 slide, scaled by the page around it. */\nhtml,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#fffaf0}\nbody.cg-child #cg-game.eg{margin:0 auto}\n\n\u003c/style>\n\u003c/head>\n\u003cbody class=\"cg-child\">\n\u003cmain id=\"cg-game\">\u003c/main>\n\u003cscript>\nglobalThis.EXPLORE_GAMES = {\"schema\":2,\"games\":{\"Y7-065\":{\"lessonId\":\"Y7-065\",\"code\":\"SB-065\",\"unit\":3,\"block\":\"c\",\"title\":\"Short division, exact answers\",\"enabled\":true,\"game\":{\"name\":\"Splat! Short division\",\"players\":\"The group, in 2 teams\",\"time\":\"5 minutes\",\"how\":[\"Twelve numbers are spread over the screen. The adult reads a division, such as 432 ÷ 4.\",\"Everyone works it out on a whiteboard with short division and shows on 3. Then one pupil splats the answer.\",\"Watch for a missing 0: 432 ÷ 4 is 108, not 18. A right board scores a point for its team.\"],\"board\":{\"kind\":\"splat\",\"pupils\":\"Work it out. Show it. Then splat it.\",\"callNote\":\"The adult reads the division. Everyone works it out with short division first.\",\"cards\":[\"252\",\"212\",\"103\",\"13\",\"108\",\"18\",\"318\",\"311\",\"218\",\"230\",\"23\",\"210\"],\"calls\":[{\"say\":\"756 ÷ 3\",\"card\":\"252\"},{\"say\":\"515 ÷ 5\",\"card\":\"103\"},{\"say\":\"432 ÷ 4\",\"card\":\"108\"},{\"say\":\"954 ÷ 3\",\"card\":\"318\"},{\"say\":\"872 ÷ 4\",\"card\":\"218\"},{\"say\":\"690 ÷ 3\",\"card\":\"230\"}],\"endQuestion\":\"Which cards were never splatted, and what slip gives each of them?\",\"endAnswer\":\"212, 13, 18, 311, 210 and 23: a 0 left out of the answer, or a leftover not exchanged.\",\"title\":\"Splat! Short division\"},\"answers\":[\"756 ÷ 3: 252\",\"515 ÷ 5: 103\",\"432 ÷ 4: 108\",\"954 ÷ 3: 318\",\"872 ÷ 4: 218\",\"690 ÷ 3: 230\"]},\"cg\":{\"kind\":\"splat\",\"items\":[{\"say\":\"756 ÷ 3\",\"card\":\"252\",\"dividend\":756,\"divisor\":3,\"value\":252,\"steps\":[{\"place\":\"hundreds\",\"digit\":7,\"carryIn\":0,\"have\":7,\"q\":2,\"left\":1},{\"place\":\"tens\",\"digit\":5,\"carryIn\":10,\"have\":15,\"q\":5,\"left\":0},{\"place\":\"ones\",\"digit\":6,\"carryIn\":0,\"have\":6,\"q\":2,\"left\":0}],\"hint\":\"Share the hundreds, then the tens, then the ones. What will not share is exchanged for ten of the next column.\",\"reveal\":\"7 hundreds ÷ 3 = 2 hundreds each, 1 hundred left: exchange it for 10 tens. 15 tens ÷ 3 = 5 tens each. 6 ones ÷ 3 = 2 ones each. 756 ÷ 3 = 252.\"},{\"say\":\"515 ÷ 5\",\"card\":\"103\",\"dividend\":515,\"divisor\":5,\"value\":103,\"steps\":[{\"place\":\"hundreds\",\"digit\":5,\"carryIn\":0,\"have\":5,\"q\":1,\"left\":0},{\"place\":\"tens\",\"digit\":1,\"carryIn\":0,\"have\":1,\"q\":0,\"left\":1},{\"place\":\"ones\",\"digit\":5,\"carryIn\":10,\"have\":15,\"q\":3,\"left\":0}],\"hint\":\"Share the hundreds, then the tens, then the ones. No tens in each group? Write 0 tens; never leave the column out.\",\"reveal\":\"5 hundreds ÷ 5 = 1 hundred each. 1 ten will not go into 5 groups: write 0 tens, and exchange it for 10 ones. 15 ones ÷ 5 = 3 ones each. 515 ÷ 5 = 103.\"},{\"say\":\"432 ÷ 4\",\"card\":\"108\",\"dividend\":432,\"divisor\":4,\"value\":108,\"steps\":[{\"place\":\"hundreds\",\"digit\":4,\"carryIn\":0,\"have\":4,\"q\":1,\"left\":0},{\"place\":\"tens\",\"digit\":3,\"carryIn\":0,\"have\":3,\"q\":0,\"left\":3},{\"place\":\"ones\",\"digit\":2,\"carryIn\":30,\"have\":32,\"q\":8,\"left\":0}],\"hint\":\"Share the hundreds, then the tens, then the ones. No tens in each group? Write 0 tens; never leave the column out.\",\"reveal\":\"4 hundreds ÷ 4 = 1 hundred each. 3 tens will not go into 4 groups: write 0 tens, and exchange them for 30 ones. 32 ones ÷ 4 = 8 ones each. 432 ÷ 4 = 108.\"},{\"say\":\"954 ÷ 3\",\"card\":\"318\",\"dividend\":954,\"divisor\":3,\"value\":318,\"steps\":[{\"place\":\"hundreds\",\"digit\":9,\"carryIn\":0,\"have\":9,\"q\":3,\"left\":0},{\"place\":\"tens\",\"digit\":5,\"carryIn\":0,\"have\":5,\"q\":1,\"left\":2},{\"place\":\"ones\",\"digit\":4,\"carryIn\":20,\"have\":24,\"q\":8,\"left\":0}],\"hint\":\"Share the hundreds, then the tens, then the ones. What will not share is exchanged for ten of the next column.\",\"reveal\":\"9 hundreds ÷ 3 = 3 hundreds each. 5 tens ÷ 3 = 1 ten each, 2 tens left: exchange them for 20 ones. 24 ones ÷ 3 = 8 ones each. 954 ÷ 3 = 318.\"},{\"say\":\"872 ÷ 4\",\"card\":\"218\",\"dividend\":872,\"divisor\":4,\"value\":218,\"steps\":[{\"place\":\"hundreds\",\"digit\":8,\"carryIn\":0,\"have\":8,\"q\":2,\"left\":0},{\"place\":\"tens\",\"digit\":7,\"carryIn\":0,\"have\":7,\"q\":1,\"left\":3},{\"place\":\"ones\",\"digit\":2,\"carryIn\":30,\"have\":32,\"q\":8,\"left\":0}],\"hint\":\"Share the hundreds, then the tens, then the ones. What will not share is exchanged for ten of the next column.\",\"reveal\":\"8 hundreds ÷ 4 = 2 hundreds each. 7 tens ÷ 4 = 1 ten each, 3 tens left: exchange them for 30 ones. 32 ones ÷ 4 = 8 ones each. 872 ÷ 4 = 218.\"},{\"say\":\"690 ÷ 3\",\"card\":\"230\",\"dividend\":690,\"divisor\":3,\"value\":230,\"steps\":[{\"place\":\"hundreds\",\"digit\":6,\"carryIn\":0,\"have\":6,\"q\":2,\"left\":0},{\"place\":\"tens\",\"digit\":9,\"carryIn\":0,\"have\":9,\"q\":3,\"left\":0},{\"place\":\"ones\",\"digit\":0,\"carryIn\":0,\"have\":0,\"q\":0,\"left\":0}],\"hint\":\"Share the hundreds, then the tens, then the ones. No tens in each group? Write 0 tens; never leave the column out.\",\"reveal\":\"6 hundreds ÷ 3 = 2 hundreds each. 9 tens ÷ 3 = 3 tens each. No ones to share: write 0 ones. 690 ÷ 3 = 230.\"}],\"cards\":[\"252\",\"212\",\"103\",\"13\",\"108\",\"18\",\"318\",\"311\",\"218\",\"230\",\"23\",\"210\"],\"callNote\":\"The adult reads the division. Everyone works it out with short division first.\",\"endQuestion\":\"Which cards were never splatted, and what slip gives each of them?\",\"endAnswer\":\"212, 13, 18, 311, 210 and 23: a 0 left out of the answer, or a leftover not exchanged.\",\"screen\":{\"screen\":\"u3c_screen.py\",\"screened\":6,\"left out\":0,\"acceptedBareFacts\":0}}}}};\nglobalThis.CG_CHILD = {\"week\":6,\"lessonId\":\"Y7-065\",\"mode\":\"class\",\"eyebrow\":\"Week 6\"};\n\u003c/script>\n\u003cscript>\n/* Unit 3 class games, weeks 3 to 6: the lessons' printed board games as class games, in the Explore game frame's look\n   (explore-games.css), like Race to zero (week 2).\n     week 3  Y7-109  Shopping bingo           bingo      add two prices in columns; every card with the total crosses it\n     week 4  Y7-068  Noughts and crosses      noughts    pick a square; use the fact you know; right claims it\n     week 5  Y7-056  True or false            truefalse  is every part multiplied? the grid shows why\n     week 6  Y7-065  Splat! Short division    splat      work it out, then splat the answer card; the bus stop shows why\n   One calculation per turn; a wrong answer gets one hint in the lesson's words, then the answer (true or false has no\n   second try: its hint is a button before choosing). 1 player, 2 players, or Class with 2 to 4 teams and team points.\n   Data: root.EXPLORE_GAMES.games[lid] with `cg`, the items cg_items.py built from the lesson and screened.\n   ClassGames.mount(parent, lid, navigate, opts) mirrors ExploreGames.mount and RaceGame.mount. */\n(function (root) {\n  'use strict';\n  var doc = root.document, active = null;\n  var COLOURS = ['#4a6fa5', '#c36129', '#8057a2', '#27805a'], DRAW = '#176f70';\n  var reduced = !!(root.matchMedia && root.matchMedia('(prefers-reduced-motion: reduce)').matches);\n  var MINUS = '−', TIMES = '×', DIVIDE = '÷';\n  var LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];\n\n  // ------------------------------------------------------------------ pure helpers (tested in node)\n  function shuffle(a, rand) { a = a.slice(); rand = rand || Math.random; for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rand() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }\n  function range(n) { var a = []; for (var i = 0; i \u003c n; i++) a.push(i); return a; }\n  function commas(n) { return String(n).replace(/\\B(?=(\\d{3})+(?!\\d))/g, ','); }\n  function pounds(c) { return '£' + Math.floor(c / 100) + '.' + ('0' + c % 100).slice(-2); }\n  function parseMoney(t) { t = String(t).replace(/^£/, ''); if (!/^\\d*\\.?\\d{0,2}$/.test(t) || !/\\d/.test(t)) return null; return Math.round(parseFloat(t) * 100); }\n  function parseNumber(t) { t = String(t).replace(/,/g, ''); return /^\\d+$/.test(t) ? Number(t) : null; }\n  function lineOf(owner, who) { for (var i = 0; i \u003c LINES.length; i++) { var L = LINES[i]; if (owner[L[0]] === who && owner[L[1]] === who && owner[L[2]] === who) return L; } return null; }\n  function bingoLine(crossed) { for (var i = 0; i \u003c LINES.length; i++) { var L = LINES[i]; if (crossed[L[0]] && crossed[L[1]] && crossed[L[2]]) return L; } return null; }\n  function fullRounds(n, sides) { return sides > 1 ? n - n % sides : n; }\n  function leaders(points, n) { var best = Math.max.apply(null, points.slice(0, n)), out = []; for (var i = 0; i \u003c n; i++) if (points[i] === best) out.push(i); return out; }\n\n  function el(tag, cls, text) { var e = doc.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }\n  function btn(text, cls, fn) { var e = el('button', 'eg-button ' + (cls || ''), text); e.type = 'button'; e.onclick = fn; return e; }\n  function svg(html, cls, view) { var s = doc.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', view || '0 0 80 48'); s.setAttribute('aria-hidden', 'true'); if (cls) s.setAttribute('class', cls); s.innerHTML = html; return s; }\n  function load(key) { try { var n = Number(root.localStorage.getItem(key)); return Number.isFinite(n) && n >= 0 ? n : 0; } catch (_) { return 0; } }\n  function save(key, value) { try { root.localStorage.setItem(key, String(value)); } catch (_) {} }\n  function saveSound(on) { try { root.localStorage.setItem('mathslab-classgames-sound', on ? 'on' : 'off'); } catch (_) {} }\n\n  // shop things, drawn plainly (no faces): the lesson's school shop\n  var THINGS = {\n    pencil: '\u003cpath d=\"M10 18h50v12H10z\" fill=\"#f2b544\" stroke=\"#b7791f\"/>\u003cpath d=\"M60 18l14 6-14 6z\" fill=\"#efe6d4\" stroke=\"#b7791f\"/>\u003cpath d=\"M70 22.3l4 1.7-4 1.7z\" fill=\"#4a5163\"/>\u003cpath d=\"M4 18h6v12H4z\" fill=\"#e3c7b8\" stroke=\"#a8714a\"/>',\n    ruler: '\u003crect x=\"4\" y=\"15\" width=\"72\" height=\"18\" rx=\"2\" fill=\"#f4e7c5\" stroke=\"#a8714a\"/>\u003cpath d=\"M12 15v7M20 15v4M28 15v7M36 15v4M44 15v7M52 15v4M60 15v7M68 15v4\" stroke=\"#a8714a\"/>',\n    rubber: '\u003crect x=\"16\" y=\"14\" width=\"48\" height=\"20\" rx=\"4\" fill=\"#fff\" stroke=\"#6f8291\"/>\u003cpath d=\"M40 14h20a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H40z\" fill=\"#9fd3cd\" stroke=\"#176f70\"/>',\n    'glue stick': '\u003crect x=\"30\" y=\"8\" width=\"20\" height=\"34\" rx=\"3\" fill=\"#d9f0ed\" stroke=\"#176f70\"/>\u003crect x=\"30\" y=\"8\" width=\"20\" height=\"11\" rx=\"3\" fill=\"#176f70\"/>',\n    notebook: '\u003crect x=\"20\" y=\"6\" width=\"42\" height=\"36\" rx=\"2\" fill=\"#c9d7e8\" stroke=\"#4a6fa5\"/>\u003cpath d=\"M26 12v24\" stroke=\"#4a6fa5\"/>\u003ccircle cx=\"20\" cy=\"12\" r=\"2\" fill=\"#4a6fa5\"/>\u003ccircle cx=\"20\" cy=\"20\" r=\"2\" fill=\"#4a6fa5\"/>\u003ccircle cx=\"20\" cy=\"28\" r=\"2\" fill=\"#4a6fa5\"/>\u003ccircle cx=\"20\" cy=\"36\" r=\"2\" fill=\"#4a6fa5\"/>',\n    'pencil case': '\u003crect x=\"6\" y=\"12\" width=\"68\" height=\"24\" rx=\"11\" fill=\"#e6dcf0\" stroke=\"#8057a2\"/>\u003cpath d=\"M12 19h56\" stroke=\"#8057a2\" stroke-dasharray=\"3 2\"/>\u003crect x=\"62\" y=\"16\" width=\"6\" height=\"7\" rx=\"1\" fill=\"#8057a2\"/>',\n    pen: '\u003crect x=\"8\" y=\"20\" width=\"58\" height=\"8\" rx=\"4\" fill=\"#4a6fa5\"/>\u003cpath d=\"M66 21l10 3-10 3z\" fill=\"#3a4254\"/>\u003cpath d=\"M16 20v-4h22v4\" fill=\"none\" stroke=\"#3a4254\" stroke-width=\"2\"/>',\n    sharpener: '\u003crect x=\"24\" y=\"12\" width=\"32\" height=\"24\" rx=\"4\" fill=\"#d3dbe8\" stroke=\"#6f8291\"/>\u003ccircle cx=\"40\" cy=\"24\" r=\"6\" fill=\"#fff\" stroke=\"#6f8291\"/>\u003cpath d=\"M40 18v12\" stroke=\"#6f8291\"/>'\n  };\n  var MARKS = [\n    '\u003cpath d=\"M18 18l44 44M62 18L18 62\" stroke=\"currentColor\" stroke-width=\"10\" stroke-linecap=\"round\" fill=\"none\"/>',\n    '\u003ccircle cx=\"40\" cy=\"40\" r=\"24\" stroke=\"currentColor\" stroke-width=\"9\" fill=\"none\"/>',\n    '\u003cpath d=\"M40 14l28 50H12z\" stroke=\"currentColor\" stroke-width=\"8\" stroke-linejoin=\"round\" fill=\"none\"/>',\n    '\u003crect x=\"16\" y=\"16\" width=\"48\" height=\"48\" rx=\"4\" stroke=\"currentColor\" stroke-width=\"9\" fill=\"none\"/>'];\n  var MARK_NAMES = ['X', 'O', 'Triangle', 'Square'];\n\n  // ------------------------------------------------------------------ the frame every game shares\n  function mount(parent, lid, navigate, opts) {\n    var data = ((root.EXPLORE_GAMES || {}).games || {})[lid];\n    if (!data || !data.enabled || !data.cg || !KINDS[data.cg.kind]) throw new Error('This class game is not enabled or has no items');\n    opts = opts || {};\n    if (active) active.destroy();\n    var cg = data.cg, kind = cg.kind;\n    parent.textContent = ''; parent.className = 'eg cx cx-' + kind;\n    var destroyed = false, timers = [], fxTimers = [], epoch = 0, ac = null, noiseBuf = null, key = 'mathslab-game-' + lid + '-';\n    var s = { lessonId: lid, kind: kind, mode: 'solo', nTeams: 2, names: ['Team 1', 'Team 2', 'Team 3', 'Team 4'], points: [0, 0, 0, 0], turn: 0,\n      over: false, sound: true, streak: 0, best: load(key + 'best'), rights: 0, slips: 0, hints: 0, reveals: 0, history: [], result: null };\n    var K = { s: s, data: data, cg: cg, entry: null };\n\n    var header = el('header', 'eg-header'), heading = el('div');\n    heading.appendChild(el('p', 'eg-eyebrow', (opts.eyeb controls.querySelector('.cx-go'); if (b) b.focus({ preventScroll: true });\n      },\n      key: function (e, onButton) { if (g.phase === 'ready' && (e.key === ' ' || e.key === 'Enter') && !onButton) { e.preventDefault(); next(); } }\n    };\n    function scatter(n) {\n      // twelve cards in a loose 4 by 3 spread, each nudged and tilted a little, never overlapping\n      var out = [], cols = 4, rows = Math.ceil(n / cols), order = shuffle(range(n));\n      for (var k = 0; k \u003c n; k++) {\n        var i = order[k], c = k % cols, r = Math.floor(k / cols);\n        out[i] = { x: 12 + c * 25 + (Math.random() * 6 - 3), y: 17 + r * (66 / Math.max(1, rows - 1)) + (Math.random() * 6 - 3), t: Math.round(Math.random() * 12 - 6) };\n      }\n      return out;\n    }\n    function setCards(on) { field.querySelectorAll('.cx-scard').forEach(function (b) { b.disabled = !on || b.classList.contains('hit'); }); }\n    function drawBus(it, upTo) {\n      // the bus stop: the divisor outside, the number under the shelter, the answer above, small exchanged digits\n      busInner.textContent = '';\n      busInner.appendChild(el('p', 'cx-bushead', 'Short division'));\n      if (!it) { busInner.appendChild(el('p', 'cx-busidle', 'The bus stop shows the working after each call.')); return; }\n      var stop = el('div', 'cx-stop'), top = el('div', 'cx-stoprow cx-quot'), mid = el('div', 'cx-stoprow cx-divd');\n      top.appendChild(el('span', 'cx-sd'));\n      mid.appendChild(el('span', 'cx-sd cx-divisor', String(it.divisor)));\n      it.steps.forEach(function (st, i) {\n        var shown = upTo != null && i \u003c upTo, qd = el('span', 'cx-sd' + (shown ? ' cx-in' : ''), shown ? String(st.q) : '');\n        qd.style.animationDelay = (reduced ? 0 : i * 450) + 'ms'; top.appendChild(qd);\n        var cell = el('span', 'cx-sd cx-under');\n        if (shown && st.carryIn) { var sm = el('sup', 'cx-small cx-in', String(st.carryIn / 10)); sm.style.animationDelay = (reduced ? 0 : (i - 1) * 450 + 250) + 'ms'; cell.appendChild(sm); }\n        cell.appendChild(doc.createTextNode(String(st.digit))); mid.appendChild(cell);\n      });\n      stop.appendChild(top); stop.appendChild(mid); busInner.appendChild(stop);\n      busInner.appendChild(el('p', 'cx-busq', it.say + (upTo === 3 ? ' = ' + it.card : '')));\n    }\n    function next() {\n      if (g.phase !== 'ready' || s.over) return;\n      K.audio(); K.sfx('flip'); g.at++; g.phase = 'answer'; g.tries = 0; g.missed = {};\n      var it = items[g.order[g.at]];\n      field.querySelectorAll('.cx-scard').forEach(function (b) { b.classList.remove('miss', 'cx-target'); });\n      A.tag.textContent = 'Call ' + (g.at + 1) + ' of ' + g.n; A.q.textContent = ''; A.q.className = 'eg-prompt cx-q cx-dealt';\n      A.q.appendChild(el('span', 'cx-calc', it.say));\n      A.controls.textContent = ''; A.note('');\n      drawBus(it, 0); setCards(true);\n      K.tell('Everyone works out ' + it.say + ' with short division. ' + K.goName(s.turn) + ': splat the answer.');\n      K.drawBar();\n    }\n    function splat(i, b) {\n      if (g.phase !== 'answer' || s.over || g.hit[i] != null) return;\n      K.audio();\n      var it = items[g.order[g.at]], right = cards[i] === it.card, who = s.turn;\n      K.log({ side: who, item: it.say, card: cards[i], right: right });\n      if (right) { K.right(who, g.tries === 0); hitCard(i, b, who); settle(it, true); return; }\n      K.slip(); K.wiggle(b); b.classList.add('miss'); g.tries++;\n      if (g.tries === 1) { s.hints++; A.note(it.hint, 'cx-hint'); K.tell('Not ' + cards[i] + '. ' + it.hint, 'again'); K.drawBar(); return; }\n      s.reveals++;\n      var target = field.querySelector('[data-value=\"' + it.card + '\"]'); if (target) target.classList.add('cx-target');\n      settle(it, false);\n    }\n    function hitCard(i, b, who) {\n      g.hit[i] = who; b.classList.add('hit'); b.style.setProperty('--team', K.colour(who)); b.disabled = true; K.sfx('splat');\n      var blob = svg('\u003cpath d=\"M function (hash) { if (hash === '#games') tell({ cg: 'home' }); },\n    { mode: cfg.mode || 'class', backLabel: 'All weeks', eyebrow: cfg.eyebrow, sound: true, onFullscreen: function () { tell({ cg: 'fullscreen' }); } });\n  root.CG_GAME = game;\n  tell({ cg: 'ready', week: cfg.week });\n})(window);\n\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"};

<script>
/* Unit 3 class games: the start screen, the #week1 to #week6 links and the scaling. Each game is its own page in an
   iframe laid out as one 1280 x 720 slide, and the whole slide is scaled to the window, so the board looks the same at
   1280 x 720 and 1920 x 1080. Offline: no network, no libraries. */
(function (root) {
  'use strict';
  var doc = root.document, CG = root.CG, DOCS = root.CG_DOCS || {};
  var home = doc.getElementById('cg-home'), soon = doc.getElementById('cg-soon'), play = doc.getElementById('cg-play');
  var tiles = doc.getElementById('cg-tiles'), frame = null, lastWeek = null;
  doc.getElementById('cg-pack').textContent = CG.pack + ' · Class games';

  function el(tag, cls, text) { var e = doc.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  // the tiles' pictures (cg_pics.py): geometric, quiet, no faces
  var PICS = CG.pics || {};
  function pic(name) { var d = el('div', 'cg-pic'); d.innerHTML = PICS[name] || ''; d.setAttribute('aria-hidden', 'true'); return d; }

  CG.weeks.forEach(function (w) {
    var li = el('li'), b = el('button', 'cg-tile' + (w.ready ? '' : ' soon')); b.type = 'button'; b.dataset.week = w.n;
    var top = el('div', 'cg-top'); top.appendChild(el('span', 'cg-week', 'Week ' + w.n)); top.appendChild(el('span', 'cg-topic', w.topic)); b.appendChild(top);
    b.appendChild(el('span', 'cg-name', w.game)); b.appendChild(el('span', 'cg-gsub', w.sub)); b.appendChild(pic(w.pic));
    var foot = el('div', 'cg-foot'); foot.appendChild(el('span', '', w.lesson + ' · ' + w.lessonTitle));
    foot.appendChild(w.ready ? el('span', 'cg-play', 'Play →') : el('span', 'cg-soonchip', 'Coming soon')); b.appendChild(foot);
    b.setAttribute('aria-label', 'Week ' + w.n + ', ' + w.topic + ': ' + w.game + (w.ready ? '' : ', coming soon'));
    b.addEventListener('click', function () { go('#week' + w.n); });
    li.appendChild(b); tiles.appendChild(li);
  });

  function fit() {
    var W = root.innerWidth, H = root.innerHeight, k = Math.min(W / 1280, H / 720), x = (W - 1280 * k) / 2, y = (H - 720 * k) / 2;
    [home, soon, frame].forEach(function (e) { if (e) e.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + k + ')'; });
    doc.documentElement.dataset.scale = k.toFixed(3);
  }
  function go(hash) { if (root.location.hash === hash) route(); else root.location.hash = hash; }
  function closeGame() { if (frame) { frame.remove(); frame = null; } play.hidden = true; }
  function showHome() {
    closeGame(); soon.hidden = true; home.hidden = false; doc.title = 'Unit 3 class games'; fit();
    var t = lastWeek && tiles.querySelector('[data-week="' + lastWeek + '"]'); if (t) t.focus({ preventScroll: true });
  }
  function showSoon(w) {
    closeGame(); home.hidden = true; soon.hidden = false; soon.textContent = '';
    soon.appendChild(el('p', 'cg-eyebrow', 'Week ' + w.n + ' · ' + w.topic));
    var h = el('h1', '', w.game); h.tabIndex = -1; soon.appendChild(h);
    soon.appendChild(el('p', 'cg-big', w.sub));
    soon.appendChild(pic(w.pic));
    soon.appendChild(el('p', 'cg-big', 'Coming soon. This game is being built.'));
    soon.appendChild(el('p', 'cg-sub', 'Lesson ' + w.lesson + ' · ' + w.lessonTitle + '. Until then, play it from the lesson’s slides.'));
    var back = el('button', 'cg-btn', 'All weeks'); back.type = 'button'; back.style.marginTop = '14px'; back.addEventListener('click', function () { go(''); }); soon.appendChild(back);
    doc.title = 'Week ' + w.n + ' · ' + w.game + ' · coming soon'; fit(); h.focus({ preventScroll: true });
  }
  function openGame(w) {
    closeGame(); home.hidden = true; soon.hidden = true; play.hidden = false;
    frame = doc.createElement('iframe'); frame.id = 'cg-frame'; frame.title = 'Week ' + w.n + ': ' + w.game;
    frame.setAttribute('allow', 'autoplay; fullscreen');
    frame.srcdoc = DOCS[w.doc]; play.appendChild(frame); fit();
    frame.addEventListener('load', function () { try { frame.contentWindow.focus(); } catch (_) {} });
    doc.title = 'Week ' + w.n + ' · ' + w.game + ' · Unit 3 class games';
  }
  function route() {
    var m = /^#week([1-6])$/i.exec(root.location.hash || '');
    if (!m) { showHome(); return; }
    var w = CG.weeks[Number(m[1]) - 1]; lastWeek = w.n;
    if (w.ready && DOCS[w.doc]) openGame(w); else showSoon(w);
  }
  function toggleFull() {
    try {
      if (doc.fullscreenElement) { var p = doc.exitFullscreen(); if (p && p.catch) p.catch(function () {}); }
      else if (doc.documentElement.requestFullscreen) { var q = doc.documentElement.requestFullscreen(); if (q && q.catch) q.catch(function () {}); }
    } catch (_) {}
  }
  doc.querySelectorAll('.cg-fullbtn').forEach(function (b) { b.addEventListener('click', toggleFull); });
  doc.addEventListener('fullscreenchange', function () { doc.querySelectorAll('.cg-fullbtn').forEach(function (b) { b.textContent = doc.fullscreenElement ? 'Exit full screen' : 'Full screen'; }); fit(); });
  root.addEventListener('message', function (e) {
    if (!frame || e.source !== frame.contentWindow) return;
    var d = e.data || {};
    if (d.cg === 'home') go(''); else if (d.cg === 'fullscreen') toggleFull();
  });
  root.addEventListener('resize', fit);
  root.addEventListener('hashchange', route);
  root.CG_SHELL = { route: route, fit: fit, frame: function () { return frame; } };
  route();
})(window);

</script>
